<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Kemas Kini Sesi Kursus MyEMT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="assets/css/myemt-location.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>



    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-0">Kemas Kini Sesi Kursus B dan Kursus C</h4>
                <small class="text-muted">
                    Kemas kini maklumat sesi Kursus B dan Kursus C MyEMT
                </small>
            </div>

            <a href="course_management.html" class="btn btn-primary">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
        </div>

        <!-- FORM CARD -->
        <div class="card shadow-sm border-0">

            <div class="card-header bg-white fw-bold">
                Maklumat Sesi Kursus
            </div>

            <div class="card-body">

                <form id="course-session-edit-form">

                    <div class="row g-3">

                        <!-- NAMA SESI -->
                        <div class="col-md-6">
                            <label class="form-label">Nama Sesi</label>
                            <input type="text" class="form-control" id="session-name" required
                                value="Sesi 1 / 2026">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Peringkat</label>
                            <select class="form-select" id="session-level" required>
                                <option value="National">Kebangsaan</option>
                                <option value="State">Negeri</option>
                            </select>
                        </div>

                        <!-- TARIKH MULA -->
                        <div class="col-md-6">
                            <label class="form-label">Tarikh Mula</label>
                            <input type="date" class="form-control" id="start-date" required
                                value="2026-01-15">
                        </div>

                        <!-- TARIKH TAMAT -->
                        <div class="col-md-6">
                            <label class="form-label">Tarikh Tamat</label>
                            <input type="date" class="form-control" id="end-date" required
                                value="2026-01-19">
                        </div>

                        <!-- TEMPAT -->
                        <div class="col-md-12">
                            <label class="form-label">Lokasi Kursus</label>
                            <input type="text" class="form-control" id="session-location" required data-location-picker data-latitude-field="session-latitude" data-longitude-field="session-longitude"
                                value="Kuala Lumpur">
                        </div>
                        <div class="col-md-4"><label class="form-label">Latitud Lokasi</label><input type="number" step="any" class="form-control" id="session-latitude"></div>
                        <div class="col-md-4"><label class="form-label">Longitud Lokasi</label><input type="number" step="any" class="form-control" id="session-longitude"></div>
                        <div class="col-md-4"><label class="form-label">Radius Kehadiran (meter)</label><input type="number" min="50" class="form-control" id="attendance-radius" value="300"></div>

                        <!-- SESI STRUKTUR -->
                        <div class="col-md-12">
                            <label class="form-label">Struktur Kursus</label>

                            <div class="form-check">
                                <input class="form-check-input course-component" type="checkbox" value="B-Course" checked disabled>
                                <label class="form-check-label">Kursus B: Asas EMT dan keselamatan operasi</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input course-component" type="checkbox" value="C-Course" checked disabled>
                                <label class="form-check-label">Kursus C: Klinikal dan kemahiran operasi</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input course-component" type="checkbox" value="TTX" checked disabled>
                                <label class="form-check-label">TTX: Latihan Tabletop</label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input course-component" type="checkbox" value="FTX" checked disabled>
                                <label class="form-check-label">FTX: Latihan Simulasi Lapangan</label>
                            </div>
                        </div>

                        <!-- OBJEKTIF -->
                        <div class="col-md-12">
                            <label class="form-label">Objektif Kursus</label>
                            <textarea class="form-control" rows="4" id="session-objective">Memperkasa kompetensi operasi, klinikal dan koordinasi MyEMT</textarea>
                        </div>
                        <div class="col-md-12"><label class="form-label">Tentatif Latihan</label><textarea class="form-control" rows="7" id="session-tentative" placeholder="Tarikh | masa | aktiviti | tempat"></textarea><div class="form-text">Satu aktiviti setiap baris.</div></div>

                        <!-- STATUS -->
                        <div class="col-md-6">
                            <label class="form-label">Status Sesi</label>
                            <select class="form-select" id="session-status">

                                <option>Dibuka</option>
                                <option>Hampir Penuh</option>
                                <option>Belum Dibuka</option>
                                <option>Ditutup</option>
                                <option>Selesai</option>

                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Kuota Peserta</label>
                            <input type="number" class="form-control" id="session-quota" min="1" required>
                        </div>

                    </div>

                    <!-- BUTTON -->
                    <div class="mt-4 d-flex justify-content-end">

                        <button type="reset" class="btn btn-outline-secondary me-2">
                            Reset
                        </button>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>
                            Simpan Sesi
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </main>





  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="assets/js/config.js"></script>
<script src="assets/js/myemt-location.js"></script>
<script>
const sessionId = new URLSearchParams(location.search).get('id');
const editForm = document.getElementById('course-session-edit-form');
const field = id => document.getElementById(id);

async function loadSession() {
  if (!sessionId) { alert('ID sesi tidak dijumpai.'); location.href='course_management.html'; return; }
  try{const res=await fetch(`${API}/api/sessions/${encodeURIComponent(sessionId)}`),json=await res.json().catch(()=>({}));
  if(!res.ok||!json.success)throw new Error(`${json.message||`HTTP ${res.status}`} (/api/sessions/${sessionId})`);
const s=json.data; field('session-name').value=s.name||''; field('session-level').value=s.level||'National'; field('start-date').value=s.startDate||''; field('end-date').value=s.endDate||''; field('session-location').value=s.location||''; field('session-latitude').value=s.latitude??''; field('session-longitude').value=s.longitude??''; window.MyEMTLocation?.refresh(field('session-location')); field('attendance-radius').value=s.attendanceRadiusM||300; field('session-tentative').value=(s.tentative||[]).map(item=>[item.date,item.time,item.activity,item.venue].join(' | ')).join('\n'); field('session-objective').value=s.objective||''; field('session-status').value=s.status||'Belum Dibuka'; field('session-quota').value=s.quota||1;
  if(Array.isArray(s.components)&&s.components.length) document.querySelectorAll('.course-component').forEach(box=>box.checked=s.components.includes(box.value));
  }catch(error){alert(`Sesi kursus tidak dapat dimuatkan: ${error.message}`);editForm.querySelector('[type=submit]').disabled=true;}
}

editForm.addEventListener('submit',async event=>{
  event.preventDefault();
  if(field('end-date').value<field('start-date').value)return alert('Tarikh tamat tidak boleh mendahului tarikh mula.');
const payload={name:field('session-name').value.trim(),level:field('session-level').value,startDate:field('start-date').value,endDate:field('end-date').value,location:field('session-location').value.trim(),latitude:Number(field('session-latitude').value)||null,longitude:Number(field('session-longitude').value)||null,attendanceRadiusM:Number(field('attendance-radius').value)||300,tentative:field('session-tentative').value.split('\n').map(line=>line.trim()).filter(Boolean).map(line=>{const [date,time,activity,venue]=line.split('|').map(value=>value.trim());return {date:date||'',time:time||'',activity:activity||'',venue:venue||''};}),objective:field('session-objective').value.trim(),status:field('session-status').value,quota:Number(field('session-quota').value),components:['B-Course','C-Course','TTX','FTX']};
  const button=editForm.querySelector('[type=submit]'); button.disabled=true;
try{const res=await fetch(`${API}/api/sessions/${encodeURIComponent(sessionId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),json=await res.json().catch(()=>({}));if(!res.ok||!json.success)throw new Error(`${json.message||`HTTP ${res.status}`} (/api/sessions/${sessionId})`);alert('Sesi kursus berjaya dikemas kini.');location.href='course_management.html';}catch(error){alert(`Kemas kini kursus gagal: ${error.message}`);button.disabled=false;}
});
document.addEventListener('DOMContentLoaded',loadSession);
</script>

</body>
</html>
