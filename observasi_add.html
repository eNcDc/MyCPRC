<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Rekod Ruang Observasi | MyEMT</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link href="assets/css/main.css" rel="stylesheet"><link href="assets/css/myemt.css" rel="stylesheet"></head>
<body><div id="header"></div><div class="container-fluid"><div class="row"><aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside><main class="col-md-9 col-lg-10 px-4 py-4"><div style="max-width:960px;margin:auto"><a id="backLink" class="btn btn-outline-secondary mb-3" href="mission_detail.html"><i class="bi bi-arrow-left me-1"></i>Kembali</a><div class="card shadow-sm border-0"><div class="card-body p-4"><h1 class="h4">Tambah Rekod Ruang Observasi</h1><p class="text-muted">Pilih pesakit daripada rekod MDS, kemudian masukkan catatan observasi sahaja.</p>
<form id="clinicalOperationForm" data-resource="observations"><div id="formStatus" hidden></div><div class="row g-3">
<div class="col-md-6"><label class="form-label">ID MDS</label><input class="form-control bg-light" name="mdsId" readonly required></div><div class="col-md-6"><label class="form-label">Nama Pesakit</label><input class="form-control bg-light" name="patientName" readonly required maxlength="200"></div>
<div class="col-md-4"><label class="form-label">Jenis Rekod</label><select id="recordType" class="form-select" name="recordType" required><option value="nurse_note">Nota Jururawat</option><option value="doctor_order">Arahan Doktor</option></select></div><div class="col-md-4"><label class="form-label">Tarikh</label><input type="date" class="form-control" name="observationDate" required></div><div class="col-md-4"><label class="form-label">Masa</label><input type="time" class="form-control" name="observationTime" required></div>
<div class="col-md-6"><label class="form-label">Lokasi / Katil</label><input class="form-control" name="location"></div><div id="orderDurationField" class="col-md-6 d-none"><label class="form-label">Tempoh Arahan Doktor</label><select class="form-select" name="orderDuration"><option value="one_day">Satu Hari</option><option value="continuous">Berterusan</option></select></div>
<div class="col-12"><label id="informationLabel" class="form-label">Maklumat Nota Jururawat</label><textarea class="form-control" name="information" rows="5" required maxlength="3000" placeholder="Catat keadaan pesakit, pemerhatian, intervensi dan respons pesakit."></textarea></div><div id="nurseField" class="col-md-6"><label class="form-label">Nama Jururawat</label><input class="form-control" name="recordedBy"></div><div id="doctorField" class="col-md-6 d-none"><label class="form-label">Nama Doktor</label><input class="form-control" name="doctorName"></div>
</div><div class="text-end mt-4"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i>Simpan Rekod</button></div></form></div></div></div></main></div></div><div id="footer"></div>
<script>fetch('header.html').then(r=>r.text()).then(t=>document.getElementById('header').innerHTML=t);fetch('sidebar.html').then(r=>r.text()).then(t=>document.getElementById('sidebar-placeholder').innerHTML=t);fetch('footer.html').then(r=>r.text()).then(t=>document.getElementById('footer').innerHTML=t);</script><script src="assets/js/config.js"></script><script src="assets/js/mds-form-prefill.js"></script><script src="assets/js/clinical-operation-form.js"></script></body></html>
