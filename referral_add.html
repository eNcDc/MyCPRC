<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tambah Borang Rujukan | MyEMT</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="assets/css/myemt.css"></head><body><main class="container py-4" style="max-width:960px"><a class="btn btn-outline-secondary mb-3" href="mission_detail.html">Kembali</a><div class="card shadow-sm"><div class="card-body p-4"><h1 class="h4">Tambah Borang Rujukan Pesakit</h1><p class="text-muted">Maklumat minimum untuk kesinambungan rawatan dan serahan kepada fasiliti penerima.</p><form id="clinicalOperationForm" data-resource="referrals"><div id="formStatus" hidden></div><div class="row g-3"><div class="col-md-6"><label class="form-label">ID MDS</label><input class="form-control" name="mdsId"></div><div class="col-md-6"><label class="form-label">Nama Pesakit</label><input class="form-control" name="patientName" required maxlength="200"></div><div class="col-md-4"><label class="form-label">Tarikh Rujukan</label><input type="date" class="form-control" name="referralDate" required></div><div class="col-md-4"><label class="form-label">Masa</label><input type="time" class="form-control" name="referralTime" required></div><div class="col-md-4"><label class="form-label">Keutamaan</label><select class="form-select" name="urgency" required><option>Biasa</option><option>Segera</option><option>Kritikal</option></select></div><div class="col-md-6"><label class="form-label">Fasiliti Perujuk</label><input class="form-control" name="referringFacility" required></div><div class="col-md-6"><label class="form-label">Pegawai / Telefon Perujuk</label><input class="form-control" name="referringContact"></div><div class="col-md-6"><label class="form-label">Fasiliti Penerima</label><input class="form-control" name="receivingFacility" required></div><div class="col-md-6"><label class="form-label">Pegawai / Telefon Penerima</label><input class="form-control" name="receivingContact"></div><div class="col-12"><label class="form-label">Diagnosis Utama</label><textarea class="form-control" name="diagnosis" required maxlength="1000"></textarea></div><div class="col-12"><label class="form-label">Sebab Rujukan dan Ringkasan Klinikal</label><textarea class="form-control" name="clinicalSummary" required maxlength="3000"></textarea></div><div class="col-12"><label class="form-label">Rawatan / Ubat Telah Diberikan</label><textarea class="form-control" name="treatment" maxlength="2000"></textarea></div><div class="col-md-4"><label class="form-label">Pengangkutan</label><input class="form-control" name="transportMode"></div><div class="col-md-4"><label class="form-label">Pengiring</label><input class="form-control" name="escort"></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status" required><option>Draf</option><option>Dihantar</option><option>Diterima</option><option>Selesai</option></select></div><div class="col-md-6"><label class="form-label">Disediakan Oleh</label><input class="form-control" name="preparedBy" required></div><div class="col-md-6"><label class="form-label">Jawatan</label><input class="form-control" name="preparerPosition" required></div></div><div class="text-end mt-4"><button class="btn btn-primary" type="submit">Simpan Rujukan</button></div></form></div></div></main><script src="assets/js/config.js"></script><script src="assets/js/clinical-operation-form.js"></script></body></html>
