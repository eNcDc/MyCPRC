<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Pengurusan Sumber Bencana</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ikon Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS Leaflet untuk peta -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <!-- CSS utama sistem -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

<!-- ===== HEADER ===== -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- ===== SIDEBAR ===== -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder">
      <!-- Sidebar akan dimuatkan di sini -->
    </aside>
    <!-- ===== KANDUNGAN UTAMA ===== -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

      <!-- Tajuk utama DRM -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Pengurusan Sumber Bencana (DRM)</h3>
      </div>

      <!-- Tab utama DRM -->
      <ul class="nav drm-main-tabs mb-4" id="drmTabs" role="tablist">

        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="drm-dashboard-tab" data-bs-toggle="tab" data-bs-target="#drmDashboardPane" type="button" role="tab">
            <i class="bi bi-speedometer2"></i> Papan Pemuka
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="drm-forecasting-tab" data-bs-toggle="tab" data-bs-target="#drmForecastingPane" type="button" role="tab">
            <i class="bi bi-graph-up-arrow"></i> Ramalan Kesiapsiagaan
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="drm-reports-tab" data-bs-toggle="tab" data-bs-target="#drmReportsPane" type="button" role="tab">
            <i class="bi bi-file-earmark-text"></i> Laporan DRM
          </button>
        </li>

      </ul>

      <!-- Kandungan tab -->
      <div class="tab-content" id="drmTabsContent">

        <!-- Tab papan pemuka -->
        <div class="tab-pane fade show active" id="drmDashboardPane" role="tabpanel">
          <div id="drm-dashboard-content">
            <!-- drm_dashboard2.html akan dimuatkan di sini -->
          </div>
        </div>

        <!-- Tab ramalan kesiapsiagaan -->
        <div class="tab-pane fade" id="drmForecastingPane" role="tabpanel">
          <div id="drm-forecasting-content">
            <!-- forecastingDRM.html akan dimuatkan di sini -->
          </div>
        </div>

       <!-- Tab laporan DRM -->
        <div class="tab-pane fade" id="drmReportsPane" role="tabpanel">

          <!-- Button borang hanya muncul dalam tab laporan -->
          <div class="row g-3 mb-4">
            <div class="col d-flex justify-content-end">
              <a href="drmho_form.html" class="btn btn-primary me-2">
                <i class="bi bi-plus-circle me-1"></i> Borang Pejabat Kesihatan Daerah
              </a>

              <a href="drmhsp_form.html" class="btn btn-primary">
                <i class="bi bi-plus-circle me-1"></i> Borang Hospital
              </a>
            </div>
          </div>

          <!-- Ringkasan laporan -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Jumlah Laporan</h6>
                  <h3 class="mb-0" id="drmReportTotal">0</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Draf</h6>
                  <h3 class="mb-0" id="drmReportDraft">0</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Dihantar</h6>
                  <h3 class="mb-0" id="drmReportSubmitted">0</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- Jadual laporan terkini -->
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <strong>Laporan Terkini</strong>
            </div>

            <div class="table-responsive">
              <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Tarikh</th>
                    <th>Jenis Laporan</th>
                    <th>Status</th>
                    <th class="text-end">Tindakan</th>
                  </tr>
                </thead>

                <tbody id="drmReportsTableBody">
                  <tr>
                    <td colspan="4" class="text-center text-muted py-4">Tiada laporan dijumpai.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

      </div>

    </main>
  </div>
</div>

<!-- ===== FOOTER ===== -->
<div id="footer"></div>

<!-- JS Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Library dashboard -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- JS dashboard DRM sedia ada -->
<script src="assets/js/drm_dashboard2.js"></script>

<!-- JS ramalan kesiapsiagaan DRM -->
<script src="assets/js/drm_forecasting.js"></script>

<!-- JS laporan DRM -->
<script src="assets/js/reportDRM.js"></script>

<script>
  // ===== MUATKAN HEADER =====
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header").innerHTML = data);

  // ===== MUATKAN SIDEBAR =====
  fetch("sidebar.html")
    .then(res => res.text())
    .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);

  // ===== MUATKAN FOOTER =====
  fetch("footer.html")
    .then(res => res.text())
    .then(data => document.getElementById("footer").innerHTML = data);

  // ===== MUATKAN PAPAN PEMUKA DRM =====
  fetch("drm_dashboard2.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("drm-dashboard-content").innerHTML = data;

      if (typeof initDrmDashboard === "function") {
        initDrmDashboard();
      }
    })
    .catch(err => console.error("Gagal memuatkan dashboard DRM:", err));

  // ===== MUATKAN RAMALAN KESIAPSIAGAAN DRM =====
  fetch("forecastingDRM.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("drm-forecasting-content").innerHTML = data;

      if (typeof initDrmForecasting === "function") {
        initDrmForecasting();
      }
    })
    .catch(err => console.error("Gagal memuatkan ramalan DRM:", err));

  // ===== REFRESH LAPORAN BILA TAB DIBUKA =====
  document.getElementById("drm-reports-tab").addEventListener("shown.bs.tab", function () {
    if (typeof loadDrmReportsTable === "function") {
      loadDrmReportsTable();
    }
  });
</script>

<script src="assets/js/wizard-form.js"></script>

</body>
</html>
