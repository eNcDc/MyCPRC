<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Tambah Pengangkutan Misi MyEMT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="assets/css/myemt-location.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>
</head>
<body>
<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">
    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h4 class="mb-0">Tambah Pengangkutan EMT</h4>
                <small class="text-muted">
                    Daftar rekod pengangkutan logistik EMT baharu
                </small>
            </div>
            <div class="mb-3 d-flex justify-content-end">
            <a href="mission_detail.html" class="btn btn-primary">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
            </div>
        </div>

        <!-- FORM CARD -->
        <div class="card shadow-sm border-0 mb-3">
            <div class="card-header bg-white">
                <strong>Borang Tambah Pengangkutan EMT</strong>
            </div>
            <div class="card-body">
                <form data-operational-form="transport">
                    <!-- MISSION NAME (READ ONLY) -->
                    <div class="mb-4">
                        <label class="form-label text-muted">Nama Misi EMT</label>
                        <input type="text"
                                class="form-control bg-light"
                                data-mission-name
                                readonly>
                        <small class="text-muted">Ditarik dari rekod misi</small>
                    </div>
                    <hr>

                    <!-- VEHICLE INFO -->
                    <h6 class="fw-semibold mb-3 text-muted">Maklumat Kenderaan</h6>

                    <div class="row g-3">
                        <!-- VEHICLE TYPE -->
                        <div class="col-md-6">
                            <label class="form-label">Jenis Kenderaan</label>

                            <select class="form-select" id="vehicleType" name="vehicleType" required onchange="toggleOtherVehicle()">
                            <option value="" selected disabled>-- Pilih Kenderaan --</option>
                            <option>Ambulans</option>
                            <option>Lori</option>
                            <option>Kenderaan 4x4</option>
                            <option>Van Perubatan</option>
                            <option value="Lain-lain">Lain-lain</option>
                            </select>
                        </div>

                        <!-- OTHERS INPUT -->
                        <div class="col-md-6 d-none" id="otherVehicleBox">
                            <label class="form-label">Nyatakan Jenis Kenderaan</label>
                            <input type="text" class="form-control" name="otherVehicleType" maxlength="100"
                                placeholder="Contoh: Bas Mobil Klinik">
                        </div>

                        <div class="col-md-6"><label class="form-label">Nama / Kod Kenderaan</label><input type="text" class="form-control" name="vehicleName" required maxlength="200" placeholder="Contoh: Ambulans Misi 01"></div>

                        <!-- REG NO -->
                        <div class="col-md-4">
                            <label class="form-label">No. Pendaftaran</label>
                            <input type="text" class="form-control" name="registrationNumber" required maxlength="50"
                                placeholder="Contoh: WXY1234">
                        </div>

                        <div class="col-md-4"><label class="form-label">Kapasiti Penumpang</label><input type="number" class="form-control" name="passengerCapacity" min="0" step="1" required></div>
                        <div class="col-md-4"><label class="form-label">Kapasiti Muatan (kg)</label><input type="number" class="form-control" name="loadCapacity" min="0" step="0.01"></div>
                        <div class="col-md-4"><label class="form-label">Jenis Bahan Api</label><select class="form-select" name="fuelType" required><option value="">-- Pilih --</option><option>Petrol</option><option>Diesel</option><option>Elektrik</option><option>Hibrid</option><option>Tidak Berkenaan</option></select></div>

                        <!-- CAPACITY -->
                        <div class="col-md-4">
                            <label class="form-label">Catatan Kapasiti</label>
                            <input type="text" class="form-control" name="capacityNote" maxlength="200" placeholder="Contoh: Pesakit dan peralatan perubatan">
                        </div>

                        <!-- DRIVER -->
                        <div class="col-md-4">
                            <label class="form-label">Pemandu</label>
                            <input type="text" class="form-control" name="driver" maxlength="200"
                                placeholder="Nama pemandu">
                        </div>

                        <div class="col-md-4"><label class="form-label">Telefon Pemandu</label><input type="tel" class="form-control" name="driverPhone" maxlength="30"></div>
                        <div class="col-md-4"><label class="form-label">Unit Bertanggungjawab</label><input type="text" class="form-control" name="responsibleUnit" required maxlength="200"></div>
                        <div class="col-12"><label class="form-label">Lokasi Semasa</label><input type="text" class="form-control" name="currentLocation" required maxlength="200" data-location-picker><input type="hidden" name="latitude"><input type="hidden" name="longitude"></div>
                        <div class="col-md-4"><label class="form-label">Tarikh Servis Terakhir</label><input type="date" class="form-control" name="lastServiceDate"></div>
                        <div class="col-md-4"><label class="form-label">Tarikh Servis Seterusnya</label><input type="date" class="form-control" name="nextServiceDate"></div>

                        <!-- STATUS -->
                        <div class="col-md-4">
                            <label class="form-label">Status Pengangkutan</label>
                            <select class="form-select" name="status" required>
                                <option value="" selected disabled>-- Pilih Status --</option>
                                <option>Tersedia</option>
                                <option>Digunakan</option>
                                <option>Penyelenggaraan</option>
                                <option>Sedia Digunakan</option>
                            </select>
                        </div>

                        <!-- NOTES -->
                        <div class="col-md-8">
                            <label class="form-label">Catatan</label>
                            <textarea class="form-control" rows="2" name="notes" maxlength="1000"
                                    placeholder="Maklumat tambahan (jika ada)"></textarea>
                        </div>
                    </div>

                    <!-- ACTION BUTTONS -->
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="mission_detail.html" id="operationalCancelLink"
                            class="btn btn-outline-secondary rounded-pill px-4">
                            Batal
                        </a>
                        <button type="submit"
                                class="btn btn-dark rounded-pill px-4 shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Simpan
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="assets/js/myemt-location.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/operational-form.js"></script>

<!--TEKAN OTHERS THAN INPUT BOX KELUAR-->
<!-- JS -->
<script>
function toggleOtherVehicle() {
  const select = document.getElementById("vehicleType");
  const box = document.getElementById("otherVehicleBox");

  const otherField = box.querySelector('input');
  if (select.value === "Lain-lain") {
    box.classList.remove("d-none");
    otherField.required = true;
  } else {
    box.classList.add("d-none");
    otherField.required = false;
    otherField.value = "";
  }
}
</script>

</body>
</html>
