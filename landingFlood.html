</script>

<!-- HELPER LOAD SCRIPT -->
<!-- Function ini bantu load file JS dan cuba path lain jika path pertama gagal -->
<script>
  function loadScriptWithFallback(scriptUrls, onLoad) {
    let index = 0;

    function tryLoadScript() {
      if (index >= scriptUrls.length) {
        console.error("All script paths failed:", scriptUrls);
        return;
      }

      const script = document.createElement("script");
      script.src = scriptUrls[index];

      script.onload = () => {
        if (typeof onLoad === "function") {
          onLoad();
        }
      };

      script.onerror = () => {
        console.warn("Failed to load script:", scriptUrls[index]);
        index++;
        tryLoadScript();
      };

      document.body.appendChild(script);
    }

    tryLoadScript();
  }
</script>

<!-- LOAD FLOOD DASHBOARD -->
<!-- HTML dashboard dimasukkan dulu, kemudian JS dashboard dijalankan -->
<script>
  fetch("flood_dashboard2.html")
    .then(res => {
      if (!res.ok) {
        throw new Error("flood_dashboard2.html not found. Check filename uppercase/lowercase.");
      }
      return res.text();
    })
    .then(data => {
      document.getElementById("flood-dashboard-content").innerHTML = data;

      loadScriptWithFallback(
        [
          "assets/js/flood_dashboard2.js?v=20260726",
        ],
        function () {
          if (typeof initFloodDashboard === "function") {
            initFloodDashboard();
          }
        }
      );
    })
    .catch(err => console.error("Failed to load Flood dashboard:", err));
</script>

<!-- LOAD ALERT & FORECASTING -->
<!-- HTML alert dimasukkan dulu, kemudian JS MET Malaysia dijalankan -->
<script>
  fetch("forecastingFLOOD.html")
    .then(res => {
      if (!res.ok) {

    })
    .then(data => {

      loadScriptWithFallback(
        [

            initFloodAlertForecasting();

          }
        }

    })
    .catch(err => console.error("Failed to load Alert & Forecasting:", err));
</script>

<!-- BETULKAN SAIZ MAP BILA TAB DIBUKA -->
<!-- Leaflet map kadang-kadang blank kalau map dibuat masa tab masih hidden -->
<script>
  document.addEventListener("shown.bs.tab", function (event) {
    const target = event.target.getAttribute("data-bs-target");

    if (target === "#flood-dashboard-pane" && typeof window.refreshFloodDashboardMap === "function") {
      window.refreshFloodDashboardMap();
    }

    if (target === "#flood-alert-pane" && typeof window.refreshMetMalaysiaMap === "function") {
      window.refreshMetMalaysiaMap();
    }

    if (target === "#flood-alert-pane" && typeof window.initFloodAlertForecasting === "function") {
      window.initFloodAlertForecasting();
    }
  });
</script>
