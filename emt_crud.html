<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")

  .then(data => document.getElementById("footer").innerHTML = data);

  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const MISSION_STATUS = {
  'Selesai':           { badge: 'bg-success',  label: 'Selesai' },
  'Sedang Dijalankan': { badge: 'bg-primary',  label: 'Sedang Dijalankan' },
  'Perancangan':       { badge: 'bg-secondary', label: 'Perancangan' }
};

async function loadDashboard() {
  const [mRes, aRes] = await Promise.all([
    fetch('/api/missions'),
    fetch('/api/members')
  ]);
  const missions = (await mRes.json()).data || [];
  const members  = (await aRes.json()).data || [];

  document.getElementById('countCompleted').textContent = missions.filter(m => m.status === 'Selesai').length;
  document.getElementById('countActive').textContent    = missions.filter(m => m.status === 'Sedang Dijalankan').length;
  document.getElementById('countMembers').textContent   = members.filter(m => m.status === 'approved').length;

  const tbody = document.getElementById('tbodyMissions');
  if (missions.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">Tiada misi berdaftar</td></tr>';
    return;
  }

  tbody.innerHTML = missions.map(m => {
    const s = MISSION_STATUS[m.status] || { badge: 'bg-secondary', label: m.status };
    return `<tr>
      <td class="fw-semibold">${m.name || '-'}</td>
      <td>${m.startDate || '-'}</td>
      <td>${m.estimatedEnd || '-'}</td>
      <td>${m.actualEnd || '<span class="text-muted">-</span>'}</td>
      <td><span class="badge ${s.badge}">${s.label}</span></td>
      <td>-</td>
      <td class="text-center">
        <a href="mission_detail.html?id=${m.id}" class="btn btn-sm btn-outline-primary me-1">Papar</a>
        <a href="mission_edit.html?id=${m.id}" class="btn btn-sm btn-outline-secondary">Edit</a>
      </td>
    </tr>`;
  }).join('');
}

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
