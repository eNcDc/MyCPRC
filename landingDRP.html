<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Profil Risiko Daerah</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Ikon Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- CSS Leaflet untuk peta -->
  <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">

  <!-- CSS utama sistem -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

<!-- ===== HEADER ===== -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- ===== SIDEBAR ===== -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder">
      <!-- Sidebar akan dimuatkan di sini -->
    </aside>

    <!-- ===== KANDUNGAN UTAMA ===== -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

      <!-- Tajuk utama DRP -->
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-0">Profil Risiko Daerah (DRP)</h3>

        <a href="drp_form.html" class="btn btn-primary">
          <i class="bi bi-plus-circle me-1"></i> Isi Borang Baharu
        </a>
      </div>

      <!-- Tab utama DRP -->
      <ul class="nav drp-main-tabs mb-4" id="drpMainTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="drp-dashboard-tab" data-bs-toggle="tab" data-bs-target="#drpDashboardPane" type="button" role="tab">
            <i class="bi bi-speedometer2"></i> Papan Pemuka
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="drp-forecasting-tab" data-bs-toggle="tab" data-bs-target="#drpForecastingPane" type="button" role="tab">
            <i class="bi bi-graph-up-arrow"></i> Ramalan Risiko
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button class="nav-link" id="drp-reports-tab" data-bs-toggle="tab" data-bs-target="#drpReportsPane" type="button" role="tab">
            <i class="bi bi-file-earmark-text"></i> Laporan DRP
          </button>
        </li>
      </ul>

      <!-- Isi setiap tab -->
      <div class="tab-content">

        <!-- Tab papan pemuka -->
        <div class="tab-pane fade show active" id="drpDashboardPane" role="tabpanel">
          <div id="drp-dashboard-content"></div>
        </div>

        <!-- Tab ramalan risiko -->
        <div class="tab-pane fade" id="drpForecastingPane" role="tabpanel">
          <div id="drp-forecasting-content"></div>
        </div>

        <!-- Tab laporan DRP -->
        <div class="tab-pane fade" id="drpReportsPane" role="tabpanel">

          <!-- Ringkasan laporan -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Jumlah Laporan</h6>
                  <h3 class="mb-0" id="drpReportTotal">0</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Draf</h6>
                  <h3 class="mb-0" id="drpReportDraft">0</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Dihantar</h6>
                  <h3 class="mb-0" id="drpReportSubmitted">0</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- Jadual laporan terkini -->
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <strong>Laporan Terkini</strong>
            </div>

            <div class="table-responsive">
              <table class="table table-striped table-bordered mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Tarikh</th>
                    <th>Jenis Bencana</th>
                    <th>Status</th>
                    <th class="text-end">Tindakan</th>
                  </tr>
                </thead>

                <tbody id="drpReportsTableBody">
                  <tr>
                    <td colspan="4" class="text-center text-muted py-4">Tiada laporan dijumpai.</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<!-- ===== FOOTER ===== -->
<div id="footer"></div>

<!-- JS Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS Leaflet untuk peta -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- JS Chart untuk carta -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- JS Excel untuk muat turun data -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<!-- JS DRP -->
<script src="assets/js/drp_dashboard3.js"></script>
<script src="assets/js/drp_forecasting.js"></script>
<script src="assets/js/reportDRP.js"></script>

<script>
  // ===== MUATKAN HEADER, SIDEBAR DAN FOOTER =====
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header").innerHTML = data);

  fetch("sidebar.html")
    .then(res => res.text())
    .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);

  fetch("footer.html")
    .then(res => res.text())
    .then(data => document.getElementById("footer").innerHTML = data);

  // ===== MUATKAN PAPAN PEMUKA DRP =====
  fetch("drp_dashboard3.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("drp-dashboard-content").innerHTML = data;

      if (typeof initDrpDashboard === "function") {
        initDrpDashboard();
      }
    });

  // ===== MUATKAN RAMALAN RISIKO DRP =====
  fetch("forecastingDRP.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("drp-forecasting-content").innerHTML = data;

      if (typeof initDrpForecasting === "function") {
        initDrpForecasting();
      }
    });

  // ===== REFRESH JADUAL LAPORAN BILA TAB DIBUKA =====
  document.getElementById("drp-reports-tab").addEventListener("shown.bs.tab", function () {
    if (typeof loadDrpReportsTable === "function") {
      loadDrpReportsTable();
    }
  });
</script>

</body>
</html>
