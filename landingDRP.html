<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Disaster Risk Profile</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Main CSS -->
  <link href="assets/css/main.css" rel="stylesheet">

  <!-- neww add for dashboard live data insert -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- LEFT PANEL -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder">
      <!-- Sidebar will be loaded here -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">District Risk Profile (DRP)</h4>

        <!-- BUTTON ISI FORM -->
        <a href="drp_form.html" class="btn btn-primary">
          <i class="bi bi-plus-circle me-1"></i> Isi Borang Baharu
        </a>
      </div>

      <!-- TAB BAR -->
      <ul class="nav nav-tabs mb-4" id="drpTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button 
            class="nav-link active" 
            id="dashboard-tab" 
            data-bs-toggle="tab" 
            data-bs-target="#dashboard-pane" 
            type="button" 
            role="tab">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button 
            class="nav-link" 
            id="drp-tab" 
            data-bs-toggle="tab" 
            data-bs-target="#drp-pane" 
            type="button" 
            role="tab">
            <i class="bi bi-file-earmark-text me-1"></i> DRP Reports
          </button>
        </li>
      </ul>

      <!-- TAB CONTENT -->
      <div class="tab-content" id="drpTabsContent">

        <!-- ADDING NEW -->       
        <!-- DASHBOARD TAB -->
        <div class="tab-pane fade show active" id="dashboard-pane" role="tabpanel">
          <div id="drp-dashboard-content">
            <!-- drp_dashboard.html will load here -->
          </div>
        </div>

        <!-- DRP TAB -->
        <div class="tab-pane fade" id="drp-pane" role="tabpanel">

          <!-- SUMMARY CARDS -->
          <div class="row g-3 mb-4">

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Jumlah Laporan</h6>
                  <h3 class="mb-0">12</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Draft</h6>
                  <h3 class="mb-0">3</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Submitted</h6>
                  <h3 class="mb-0">9</h3>
                </div>
              </div>
            </div>

          </div>
          <!-- ENDING -->

          <!-- RECENT REPORTS -->
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <strong>Laporan Terkini</strong>
            </div>

            <div class="table-responsive">
              <table class="table table-striped mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Tarikh</th>
                    <th>Jenis Bencana</th>
                    <th>Status</th>
                    <th class="text-end">Tindakan</th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>12/01/2026</td>
                    <td>Banjir</td>
                    <td><span class="badge bg-success">Submitted</span></td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary">View</button>
                    </td>
                  </tr>

                  <tr>
                    <td>10/01/2026</td>
                    <td>Tanah Runtuh</td>
                    <td><span class="badge bg-warning text-dark">Draft</span></td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-secondary">Edit</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

      </div>

    </main>

  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Load Header, Sidebar & Footer -->
<script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header").innerHTML = data);

  fetch("sidebar.html")
    .then(res => res.text())
    .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);  

  fetch("footer.html")
    .then(res => res.text())
    .then(data => document.getElementById("footer").innerHTML = data);
</script>

<script src="assets/js/wizard-form.js"></script>


<!-- new adding for dashboard live data insert-->>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="assets/js/drp_dashboard3.js"></script>

<!-- NEW -->
<!-- Load DRP Dashboard Content -->
<script>
  fetch("drp_dashboard3.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("drp-dashboard-content").innerHTML = data;

      if (typeof initDrpDashboard === "function") {
        initDrpDashboard();
      }
    })
    .catch(err => console.error("Failed to load DRP dashboard:", err));
</script>

</body>
</html>
