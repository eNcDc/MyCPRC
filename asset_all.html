<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Senarai Asset EMT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h4 class="mb-0">Dashboard Aset EMT</h4>
            <small class="text-muted">
                Gambaran keseluruhan aset dan operasi logistik EMT
            </small>
        </div>

        <a href="landingMyemtAdmin_mission.html"
        class="btn btn-primary">
            <i class="bi bi-arrow-left me-1"></i>
            Kembali
        </a>

    </div>

        <!-- KPI CARDS -->
        <div class="row g-3 mb-4">

            <div class="col-md-3">
                <div class="card shadow-sm border-0 border-start border-primary border-4">
                    <div class="card-body">
                        <small class="text-muted">Jumlah Aset</small>
                        <h3 class="fw-bold mb-0" id="kpi-total">...</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0 border-start border-success border-4">
                    <div class="card-body">
                        <small class="text-muted">Aset Aktif</small>
                        <h3 class="fw-bold mb-0" id="kpi-active">...</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0 border-start border-warning border-4">
                    <div class="card-body">
                        <small class="text-muted">Dalam Penyelenggaraan</small>
                        <h3 class="fw-bold mb-0" id="kpi-maintenance">...</h3>
                    </div>
                </div>
            </div>

            <div class="col-md-3">
                <div class="card shadow-sm border-0 border-start border-danger border-4">
                    <div class="card-body">
                        <small class="text-muted">Aset Kritikal</small>
                        <h3 class="fw-bold mb-0" id="kpi-critical">...</h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- CHART SECTION -->
        <div class="card shadow-sm">

            <div class="card-header bg-white">
                <strong>Analisis Aset EMT</strong>
            </div>

            <div class="card-body">

                <div class="row g-4 align-items-start">

                    <!-- BAR CHART -->
                    <div class="col-md-7">
                        <h6 class="text-muted mb-3">Kategori Aset</h6>
                        <div class="p-2 bg-light rounded">
                            <canvas id="kategoriAsetChart"></canvas>
                        </div>
                    </div>

                    <!-- PIE CHART -->
                    <div class="col-md-5">
                        <h6 class="text-muted mb-3">Status Aset</h6>
                        <div class="p-2 bg-light rounded">
                            <canvas id="statusAsetChart"></canvas>
                        </div>
                    </div>

                </div>

            </div>
        </div><br>

        <!-- CRITICAL ALERT TABLE -->
        <div class="card shadow-sm">

            <div class="card-header bg-white">
                <strong>Aset Kritikal & Perlu Tindakan</strong>
            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">
                            <tr>
                                <th>Nama Aset</th>
                                <th>Kategori</th>
                                <th>Status</th>
                                <th>Tahap</th>
                                <th>Lokasi</th>
                                <th class="text-end">Tindakan</th>
                            </tr>
                        </thead>

                        <tbody id="tbody-assets">
                            <tr><td colspan="6" class="text-center text-muted py-3">Memuatkan...</td></tr>
                        </tbody>

                    </table>

                </div>

            </div>
        </div>

    </main>


  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const STATUS_BADGE = {
  'Aktif':             'bg-success',
  'Penyelenggaraan':   'bg-warning text-dark',
  'Servis Diperlukan': 'bg-warning text-dark',
  'Rosak':             'bg-danger',
  'Hilang / Lupus':    'bg-secondary',
};
const PRIORITY_BADGE = {
  'Kritikal':  'bg-danger',
  'Tinggi':    'bg-danger',
  'Sederhana': 'bg-warning text-dark',
  'Rendah':    'bg-secondary',
};

let kategoriChart, statusChart;

async function loadAssets() {
  const [sumRes, listRes] = await Promise.all([
    fetch(`${API}/api/assets/summary`),
    fetch(`${API}/api/assets`)
  ]);
  const sum  = await sumRes.json();
  const list = (await listRes.json()).data || [];

  // KPI cards
  document.getElementById('kpi-total').textContent       = sum.total       || 0;
  document.getElementById('kpi-active').textContent      = sum.active      || 0;
  document.getElementById('kpi-maintenance').textContent = sum.maintenance  || 0;
  document.getElementById('kpi-critical').textContent    = sum.critical     || 0;

  // Critical/attention assets table
  const critical = list.filter(a => ['Rosak','Servis Diperlukan','Penyelenggaraan'].includes(a.status));
  const tbody = document.getElementById('tbody-assets');
  tbody.innerHTML = critical.length ? critical.map(a => `
    <tr>
      <td class="fw-semibold">${a.name}</td>
      <td>${a.category}</td>
      <td><span class="badge ${STATUS_BADGE[a.status] || 'bg-secondary'}">${a.status}</span></td>
      <td><span class="badge ${PRIORITY_BADGE[a.priority] || 'bg-secondary'}">${a.priority}</span></td>
      <td>${a.location}</td>
      <td class="text-end">
        <a href="asset_view2.html?id=${a.id}" class="btn btn-sm btn-outline-primary">Lihat</a>
        <a href="asset_edit2.html?id=${a.id}" class="btn btn-sm btn-outline-primary">Kemaskini</a>
      </td>
    </tr>`).join('') : '<tr><td colspan="6" class="text-center text-muted py-3">Tiada aset kritikal.</td></tr>';

  // Bar chart — by category
  const cats   = Object.keys(sum.byCategory || {});
  const catVal = cats.map(c => sum.byCategory[c]);
  if (kategoriChart) kategoriChart.destroy();
  kategoriChart = new Chart(document.getElementById('kategoriAsetChart'), {
    type: 'bar',
    data: { labels: cats, datasets: [{ label: 'Bilangan Aset', data: catVal, borderWidth: 1 }] },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });

  // Pie chart — by status
  const stats   = Object.keys(sum.byStatus || {});
  const statVal = stats.map(s => sum.byStatus[s]);
  if (statusChart) statusChart.destroy();
  statusChart = new Chart(document.getElementById('statusAsetChart'), {
    type: 'pie',
    data: { labels: stats, datasets: [{ data: statVal, borderWidth: 1 }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
  });
}

document.addEventListener('DOMContentLoaded', loadAssets);
</script>
</html>
