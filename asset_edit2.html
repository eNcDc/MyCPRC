<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Kemas Kini Aset | MyEMT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="assets/css/myemt-location.css">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

        <!-- PAGE HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-4">

            <div>
            <h4 class="mb-0">Kemas Kini Rekod Aset EMT</h4>
            <small class="text-muted" id="assetEditContext">
                Rekod aset dan peralatan EMT
            </small>
            </div>

            <div class="mb-3 d-flex justify-content-end">
            <a href="asset_all.html" class="btn btn-primary" id="assetEditBackLink">
                <i class="bi bi-arrow-left me-1"></i> Kembali
            </a>
            </div>

        </div>

        <!-- FORM CARD -->
        <div class="card shadow-sm">

            <div class="card-header bg-white">
            <strong>Maklumat Aset EMT</strong>
            </div>

            <div class="card-body">

            <form>

            <div class="row g-3">

                <!-- ASSET NAME -->
                <div class="col-md-6">
                <label class="form-label">Nama Aset</label>
                <input type="text" class="form-control"
                        value="Oxygen Cylinder"
                        placeholder="Contoh: Oxygen Cylinder / Generator / Defibrillator">
                </div>

                <!-- KUANTITI ASET -->
                <div class="col-md-3">
                    <label class="form-label">Kuantiti Aset</label>
                    <input type="number"
                        class="form-control"
                        min="1"
                        step="1"
                        value="10">
                </div>

                <div class="col-md-3"><label class="form-label">Paras Stok Minimum</label><input type="number" class="form-control" min="0" step="1"></div>

                <!-- SERIAL NUMBER -->
                <div class="col-md-3">
                <label class="form-label">No Siri</label>
                <input type="text" class="form-control"
                        value="SN-2026-AX9912">
                </div>

                <!-- CATEGORY -->
                <div class="col-md-4">
                <label class="form-label">Kategori</label>
                <select class="form-select">
                    <option>Perubatan</option>
                    <option selected>Perubatan</option>
                    <option>Elektrik</option>
                    <option>Logistik</option>
                    <option>Komunikasi</option>
                    <option>IT / Sistem</option>
                    <option>Lain-lain</option>
                </select>
                </div>

                <!-- SUB CATEGORY -->
                <div class="col-md-4">
                <label class="form-label">Sub Kategori</label>
                <input type="text" class="form-control"
                        value="Oxygen"
                        placeholder="Contoh: Oxygen / ICU / Portable">
                </div>

                <!-- JENIS -->
                <div class="col-md-4">
                <label class="form-label">Jenis Aset</label>
                <select class="form-select">
                    <option>Boleh Habis Guna (Consumable)</option>
                    <option selected>Peralatan (Equipment)</option>
                    <option>Sokongan Kenderaan</option>
                    <option>Peranti ICT</option>
                </select>
                </div>

                <!-- PROCUREMENT INFO -->
                <div class="col-12 mt-3">
                <h6 class="fw-bold text-muted">Maklumat Perolehan</h6>
                <hr class="mt-1">
                </div>

                <div class="col-md-4">
                <label class="form-label">Kategori Perolehan</label>
                <select class="form-select" required>
                    <option value="">Belum Direkodkan</option>
                    <option>Penerimaan Sumbangan</option>
                    <option>Pembelian Terus</option>
                    <option value="Aset MyEMT">Daripada Aset MyEMT</option>
                </select>
                </div>

                <div class="col-md-4">
                <label class="form-label">Asal Aset</label>
                <input type="text" class="form-control bg-light" readonly>
                </div>

                <div class="col-md-4">
                <label class="form-label">Tarikh Perolehan</label>
                <input type="date" class="form-control"
                        value="2026-01-10">
                </div>

                <div class="col-md-4">
                <label class="form-label">Kos Perolehan (RM)</label>
                <input type="number" class="form-control"
                        value="1500.00">
                </div>

                <div class="col-md-4">
                <label class="form-label">Pembekal</label>
                <input type="text" class="form-control"
                        value="MedEquip Sdn Bhd">
                </div>

                <!-- CONDITION & STATUS -->
                <div class="col-12 mt-3">
                <h6 class="fw-bold text-muted">Status & Keadaan Aset</h6>
                <hr class="mt-1">
                </div>

                <div class="col-md-4">
                <label class="form-label">Status Semasa Aset</label>
                <select class="form-select">
                    <option>Tersedia</option>
                    <option selected>Digunakan</option>
                    <option>Penyelenggaraan</option>
                    <option>Rosak</option>
                </select>
                </div>

                <div class="col-md-4"><label class="form-label">Tarikh Dikeluarkan</label><input type="date" class="form-control"></div>
                <div class="col-md-4"><label class="form-label">Tarikh Luput</label><input type="date" class="form-control"></div>

                <div class="col-md-4">
                <label class="form-label">Status Akhir Aset</label>
                <select class="form-select">
                    <option value="">Belum Ditentukan</option>
                    <option>Disumbangkan</option>
                    <option>Stok Habis</option>
                    <option>Rosak</option>
                    <option>Lain-lain</option>
                </select>
                </div>

                <div class="col-md-4">
                <label class="form-label">Status Akhir Lain</label>
                <input type="text" class="form-control" maxlength="200">
                </div>

                <div class="col-md-4">
                <label class="form-label">Keadaan Fizikal</label>
                <select class="form-select">
                    <option selected>Baik</option>
                    <option>Memuaskan</option>
                    <option>Perlu Baik Pulih</option>
                    <option>Rosak</option>
                </select>
                </div>

                <div class="col-md-4">
                <label class="form-label">Tahap Kritikal</label>
                <select class="form-select">
                    <option>Rendah</option>
                    <option selected>Sederhana</option>
                    <option>Tinggi</option>
                </select>
                </div>

                <!-- LOCATION -->
                <div class="col-12 mt-3">
                <h6 class="fw-bold text-muted">Lokasi & Pemilikan</h6>
                <hr class="mt-1">
                </div>

                <div class="col-md-6">
                <label class="form-label">Lokasi Semasa</label>
                <input type="text" class="form-control" data-location-picker
                        value="Warehouse Sabah Ops">
                <input type="hidden" name="latitude"><input type="hidden" name="longitude">
                </div>

                <div class="col-md-6">
                <label class="form-label">Pegawai Bertanggungjawab</label>
                <input type="text" class="form-control"
                        value="Unit Logistik EMT">
                </div>

                <!-- MAINTENANCE -->
                <div class="col-12 mt-3">
                <h6 class="fw-bold text-muted">Penyelenggaraan</h6>
                <hr class="mt-1">
                </div>

                <div class="col-md-4">
                <label class="form-label">Tarikh Servis Terakhir</label>
                <input type="date" class="form-control"
                        value="2025-12-15">
                </div>

                <div class="col-md-4">
                <label class="form-label">Tarikh Servis Seterusnya</label>
                <input type="date" class="form-control"
                        value="2026-06-15">
                </div>

                <div class="col-md-4">
                <label class="form-label">Warranty Tamat</label>
                <input type="date" class="form-control"
                        value="2027-01-10">
                </div>

                <!-- ADDITIONAL -->
                <div class="col-12 mt-3">
                <h6 class="fw-bold text-muted">Maklumat Tambahan</h6>
                <hr class="mt-1">
                </div>

                <div class="col-md-6">
                <label class="form-label">Catatan</label>
                <textarea class="form-control" rows="3">Aset dalam keadaan baik dan digunakan untuk operasi EMT Sabah.</textarea>
                </div>

                <div class="col-md-6">
                <label class="form-label">Dokumen Sokongan</label>
                <input type="file" class="form-control">
                <small class="text-muted">Invoice / warranty / gambar aset</small>
                </div>

            </div>

            <!-- SUBMIT -->
            <div class="d-flex justify-content-end mt-4">
                <button type="submit"
                        class="btn btn-primary px-4 rounded-pill shadow-sm">
                Kemas Kini Aset
                </button>
            </div>

            </form>

            </div>

        </div>

    </main>
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="assets/js/myemt-location.js"></script>
<script>
function fillByLabel(labelText, value) {
  if (value === undefined || value === null) return;
  for (const lbl of document.querySelectorAll('.form-label')) {
    if (lbl.textContent.trim() === labelText) {
      const parent = lbl.closest('[class*="col-"], .mb-3');
      const input = parent?.querySelector('input:not([type=file]), select, textarea');
      if (input) { input.value = String(value); return; }
    }
  }
}
function getByLabel(labelText) {
  for (const lbl of document.querySelectorAll('.form-label')) {
    if (lbl.textContent.trim() === labelText) {
      const parent = lbl.closest('[class*="col-"], .mb-3');
      const input = parent?.querySelector('input:not([type=file]):not([readonly]), select, textarea');
      return input ? input.value : null;
    }
  }
  return null;
}
function readEditableAsset(form) {
  return {
    name:getByLabel('Nama Aset'),quantity:Number(getByLabel('Kuantiti Aset')),minimumStockLevel:Number(getByLabel('Paras Stok Minimum')||0),
    serialNumber:getByLabel('No Siri'),category:getByLabel('Kategori'),subCategory:getByLabel('Sub Kategori'),assetType:getByLabel('Jenis Aset'),
    procurementDate:getByLabel('Tarikh Perolehan'),cost:getByLabel('Kos Perolehan (RM)'),supplier:getByLabel('Pembekal'),manufacturedDate:getByLabel('Tarikh Dikeluarkan'),
    expiryDate:getByLabel('Tarikh Luput'),procurementCategory:getByLabel('Kategori Perolehan'),currentStatus:getByLabel('Status Semasa Aset'),finalStatus:getByLabel('Status Akhir Aset'),
    finalStatusOther:getByLabel('Status Akhir Lain'),physicalCondition:getByLabel('Keadaan Fizikal'),priority:getByLabel('Tahap Kritikal'),location:getByLabel('Lokasi Semasa'),
    latitude:form.elements.namedItem('latitude').value?Number(form.elements.namedItem('latitude').value):null,longitude:form.elements.namedItem('longitude').value?Number(form.elements.namedItem('longitude').value):null,
    responsibleOfficer:getByLabel('Pegawai Bertanggungjawab'),lastServiceDate:getByLabel('Tarikh Servis Terakhir'),nextServiceDate:getByLabel('Tarikh Servis Seterusnya'),
    warrantyEnd:getByLabel('Warranty Tamat'),notes:getByLabel('Catatan')
  };
}

const assetEditParams = new URLSearchParams(location.search);
const id = assetEditParams.get('id');
const requestedMissionId = assetEditParams.get('missionId') || '';
let assetOwnerMissionId = requestedMissionId;
let originalAsset = null;
let originalFormState = null;
const assetEditForm = document.querySelector('form');
assetEditForm?.querySelectorAll('input:not([type="file"]):not([readonly]), textarea').forEach(field=>field.value='');
assetEditForm?.querySelectorAll('select').forEach(field=>field.selectedIndex=0);
if (id) {
  const ownershipQuery=requestedMissionId?`?missionId=${encodeURIComponent(requestedMissionId)}`:'';
  fetch(`${API}/api/assets/${encodeURIComponent(id)}${ownershipQuery}`)
    .then(async r => {const json=await r.json();if(!r.ok||!json.success)throw new Error(json.message||'Aset tidak dapat dimuatkan.');return json;})
    .then(({ data: a }) => {
      if (!a) throw new Error('Aset tidak dijumpai.');
      originalAsset={...a};
      assetOwnerMissionId=a.missionId||'';
      document.getElementById('assetEditContext').textContent=assetOwnerMissionId?`Aset milik misi ${assetOwnerMissionId}`:'Aset inventori keseluruhan MyEMT';
      if(!assetOwnerMissionId){
        const procurementLabel=[...document.querySelectorAll('.form-label')].find(label=>label.textContent.trim()==='Kategori Perolehan');
        procurementLabel?.closest('[class*="col-"]')?.querySelector('select option[value="Aset MyEMT"]')?.remove();
      }
      const back=document.getElementById('assetEditBackLink');
      if(back)back.href=assetOwnerMissionId?`mission_detail.html?id=${encodeURIComponent(assetOwnerMissionId)}#step2`:'asset_all.html';
      fillByLabel('Nama Aset', a.name);
      fillByLabel('Kuantiti Aset', a.quantity);
      fillByLabel('Paras Stok Minimum', a.minimumStockLevel ?? 2);
      fillByLabel('No Siri', a.serialNumber || a.serial);
      fillByLabel('Kategori', a.category);
      fillByLabel('Sub Kategori', a.subCategory);
      fillByLabel('Jenis Aset', a.assetType);
      fillByLabel('Tarikh Perolehan', a.procurementDate);
      fillByLabel('Kos Perolehan (RM)', a.cost);
      fillByLabel('Pembekal', a.supplier);
      fillByLabel('Tarikh Dikeluarkan', a.manufacturedDate);
      fillByLabel('Tarikh Luput', a.expiryDate);
      fillByLabel('Kategori Perolehan', a.procurementCategory);
      fillByLabel('Asal Aset', a.assetOrigin === 'MyEMT' ? 'Inventori MyEMT' : (a.procurementCategory || '-'));
      fillByLabel('Status Semasa Aset', a.currentStatus || a.status);
      fillByLabel('Status Akhir Aset', a.finalStatus);
      fillByLabel('Status Akhir Lain', a.finalStatusOther);
      fillByLabel('Keadaan Fizikal', a.physicalCondition);
      fillByLabel('Tahap Kritikal', a.priority);
      fillByLabel('Lokasi Semasa', a.location);
      form.elements.namedItem('latitude').value=a.latitude??'';
      form.elements.namedItem('longitude').value=a.longitude??'';
      window.MyEMTLocation?.refresh(document.querySelector('[data-location-picker]'));
      fillByLabel('Pegawai Bertanggungjawab', a.responsibleOfficer);
      fillByLabel('Tarikh Servis Terakhir', a.lastServiceDate);
      fillByLabel('Tarikh Servis Seterusnya', a.nextServiceDate);
      fillByLabel('Warranty Tamat', a.warrantyEnd);
      fillByLabel('Catatan', a.notes);
      originalFormState=readEditableAsset(assetEditForm);
    })
    .catch(error => {alert(error.message);document.querySelector('button[type="submit"]')?.setAttribute('disabled','');});

  const form = document.querySelector('form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const assetType=getByLabel('Jenis Aset')||'';
      if(/consumable|boleh habis guna/i.test(assetType)&&!getByLabel('Tarikh Luput')){alert('Tarikh luput diperlukan untuk aset boleh habis guna.');return;}
      if(/equipment|peralatan/i.test(assetType)&&!getByLabel('Tarikh Servis Seterusnya')){alert('Tarikh penyelenggaraan seterusnya diperlukan untuk mesin atau peralatan.');return;}
      if(!originalFormState){alert('Maklumat asal aset belum selesai dimuatkan.');return;}
      const proposed=readEditableAsset(form);
      const comparable=value=>value===null||value===undefined?'':String(value);
      const payload=Object.fromEntries(Object.entries(proposed).filter(([key,value])=>comparable(value)!==comparable(originalFormState[key])));
      if(Object.prototype.hasOwnProperty.call(payload,'currentStatus'))payload.status=payload.currentStatus;
      if(!Object.keys(payload).length){alert('Tiada perubahan untuk disimpan.');return;}
      try {
        const submitButton=form.querySelector('[type="submit"]');
        if(submitButton)submitButton.disabled=true;
        const ownershipQuery=assetOwnerMissionId?`?missionId=${encodeURIComponent(assetOwnerMissionId)}`:'';
        const res = await fetch(`${API}/api/assets/${encodeURIComponent(id)}${ownershipQuery}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const json = await res.json().catch(()=>({}));
        if (res.ok && json.success) { alert('Aset berjaya dikemas kini!'); location.href=assetOwnerMissionId?`mission_detail.html?id=${encodeURIComponent(assetOwnerMissionId)}#step2`:'asset_all.html'; }
        else {alert('Ralat: ' + (json.message || `Kemaskini gagal (HTTP ${res.status}).`));if(submitButton)submitButton.disabled=false;}
      } catch { alert('Ralat rangkaian.');form.querySelector('[type="submit"]')?.removeAttribute('disabled'); }
    });
  }
}
</script>
</body>
</html>
