<!doctype html>
<html lang="ms">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Inventori Ubat | MyEMT</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <div id="header"></div>

    <div class="container-fluid">
        <div class="row">

            <!-- SIDEBAR -->
            <aside
                class="col-md-3 col-lg-2 sidebar p-0"
                id="sidebar-placeholder">
            </aside>

            <!-- MAIN CONTENT -->
            <main class="col-md-9 col-lg-10 px-4 py-4">
                <div class="container-fluid">

                    <!-- PAGE HEADER -->
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">

                        <div>
                            <h4 class="mb-1" id="pageTitle">
                                Inventori Ubat Misi
                            </h4>

                            <p class="text-muted mb-0">
                                Stok diurus mengikut batch dan tarikh luput.
                            </p>
                        </div>

                        <a id="backLink" class="btn btn-primary">
                            <i class="bi bi-arrow-left me-1"></i>
                            <span id="backText">Kembali ke Misi</span>
                        </a>

                    </div>

                    <!-- ALERT -->
                    <div id="alerts"></div>


                    <!-- =========================================
                         TAMBAH / KEMAS KINI BATCH
                    ========================================== -->
                    <div class="card border-0 shadow-sm mb-3">

                        <div class="card-header bg-light fw-bold">
                            Tambah / Kemas Kini Batch
                        </div>

                        <div class="card-body">

                            <form id="inventoryForm" class="row g-3">

                                <input type="hidden" id="recordId">

                                <!-- KATEGORI PEROLEHAN -->
                                <div class="col-md-4" id="procurementGroup">
                                    <label class="form-label">
                                        Kategori Perolehan *
                                    </label>

                                    <select
                                        id="procurementCategory"
                                        class="form-select">

                                        <option value="Pembelian Terus">
                                            Pembelian Terus
                                        </option>

                                        <option value="Penerimaan Sumbangan">
                                            Penerimaan Sumbangan
                                        </option>

                                        <option value="Stok Ubat MyEMT">
                                            Daripada Stok Ubat MyEMT
                                        </option>

                                    </select>
                                </div>


                                <!-- SUMBER STOK MYEMT -->
                                <div class="col-md-8 d-none" id="sourceGroup">

                                    <label class="form-label">
                                        Pilih Batch Stok MyEMT *
                                    </label>

                                    <select
                                        id="sourceMedicineId"
                                        class="form-select">

                                        <option value="">
                                            -- Pilih stok --
                                        </option>

                                    </select>

                                    <div
                                        class="form-text"
                                        id="sourceInfo">
                                    </div>

                                </div>


                                <!-- NAMA UBAT -->
                                <div class="col-md-4">
                                    <label class="form-label">
                                        Nama Ubat *
                                    </label>

                                    <input
                                        id="name"
                                        class="form-control"
                                        required>
                                </div>


                                <!-- KEKUATAN -->
                                <div class="col-md-2">
                                    <label class="form-label">
                                        Kekuatan *
                                    </label>

                                    <input
                                        id="strength"
                                        class="form-control"
                                        placeholder="500 mg"
                                        required>
                                </div>


                                <!-- BENTUK -->
                                <div class="col-md-2">
                                    <label class="form-label">
                                        Bentuk *
                                    </label>

                                    <input
                                        id="form"
                                        class="form-control"
                                        placeholder="Tablet"
                                        required>
                                </div>


                                <!-- UNIT -->
                                <div class="col-md-2">
                                    <label class="form-label">
                                        Unit *
                                    </label>

                                    <input
                                        id="unit"
                                        class="form-control"
                                        placeholder="tablet"
                                        required>
                                </div>


                                <!-- NO BATCH -->
                                <div class="col-md-2">
                                    <label class="form-label">
                                        No. Batch *
                                    </label>

                                    <input
                                        id="batchNumber"
                                        class="form-control"
                                        required>
                                </div>


                                <!-- TARIKH LUPUT -->
                                <div class="col-md-3">
                                    <label class="form-label">
                                        Tarikh Luput *
                                    </label>

                                    <input
                                        id="expiryDate"
                                        type="date"
                                        class="form-control"
                                        required>
                                </div>


                                <!-- KUANTITI -->
                                <div class="col-md-3">
                                    <label class="form-label">
                                        Kuantiti *
                                    </label>

                                    <input
                                        id="quantity"
                                        type="number"
                                        min="0"
                                        step="1"
                                        class="form-control"
                                        required>
                                </div>


                                <!-- MINIMUM STOCK -->
                                <div class="col-md-3">
                                    <label class="form-label">
                                        Paras Stok Minimum *
                                    </label>

                                    <input
                                        id="minimumStock"
                                        type="number"
                                        min="0"
                                        step="1"
                                        value="10"
                                        class="form-control"
                                        required>
                                </div>


                                <!-- PEMBEKAL -->
                                <div class="col-md-3">
                                    <label class="form-label">
                                        Pembekal / Sumber
                                    </label>

                                    <input
                                        id="supplier"
                                        class="form-control">
                                </div>


                                <!-- BUTTON -->
                                <div class="col-12 d-flex justify-content-end gap-2">

                                    <button
                                        type="button"
                                        id="cancelEdit"
                                        class="btn btn-outline-secondary d-none">
                                        Batal Kemas Kini
                                    </button>

                                    <button
                                        type="submit"
                                        class="btn btn-primary">

                                        <i class="bi bi-save me-1"></i>
                                        Simpan Stok

                                    </button>

                                </div>

                            </form>

                        </div>
                    </div>


                    <!-- =========================================
                         SENARAI STOK UBAT
                    ========================================== -->
                    <div class="card border-0 shadow-sm mb-3">

                        <div class="card-header bg-light fw-bold">
                            Senarai Stok Ubat
                        </div>

                        <div class="table-responsive">

                            <table class="table table-hover align-middle mb-0">

                                <thead>
                                    <tr>
                                        <th>Ubat</th>
                                        <th>Batch</th>
                                        <th>Luput</th>
                                        <th>Baki</th>
                                        <th>Amaran</th>
                                        <th class="text-end">Tindakan</th>
                                    </tr>
                                </thead>

                                <tbody id="inventoryBody"></tbody>

                            </table>

                        </div>
                    </div>


                    <!-- =========================================
                         REKOD STOK MASUK / KELUAR
                    ========================================== -->
                    <div class="card border-0 shadow-sm">

                        <div class="card-header bg-light fw-bold">
                            Rekod Stok Masuk dan Keluar
                        </div>

                        <div class="table-responsive">

                            <table class="table table-sm align-middle mb-0">

                                <thead>
                                    <tr>
                                        <th>Tarikh</th>
                                        <th>Ubat / Batch</th>
                                        <th>Jenis</th>
                                        <th>Kuantiti</th>
                                        <th>Baki</th>
                                        <th>Catatan</th>
                                    </tr>
                                </thead>

                                <tbody id="movementBody"></tbody>

                            </table>

                        </div>
                    </div>

                </div>
            </main>

        </div>
    </div>


    <!-- FOOTER -->
    <div id="footer"></div>


    <!-- CONFIG -->
    <script src="assets/js/config.js"></script>

    <!-- BOOTSTRAP JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <script>

        /* =====================================================
           LOAD HEADER / FOOTER / SIDEBAR
        ===================================================== */

        fetch('header.html')
            .then(r => r.text())
            .then(t => header.innerHTML = t);

        fetch('footer.html')
            .then(r => r.text())
            .then(t => footer.innerHTML = t);

        fetch('sidebar.html')
            .then(r => r.text())
            .then(t => {
                document.getElementById('sidebar-placeholder').innerHTML = t;
            });


        /* =====================================================
           VARIABLES
        ===================================================== */

        const missionId =
            new URLSearchParams(location.search).get('missionId') || '';

        const esc = value =>
            String(value ?? '').replace(
                /[&<>"']/g,
                c => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[c])
            );

        const today =
            new Date().toISOString().slice(0, 10);

        let records = [];
        let centralRecords = [];
        let editingRecord = null;


        /* =====================================================
           BACK LINK
        ===================================================== */

        backLink.href = missionId
            ? `mission_detail.html?id=${encodeURIComponent(missionId)}#step6`
            : 'asset_all.html';

        if (!missionId) {

            pageTitle.textContent = 'Inventori Ubat MyEMT';
            backText.textContent = 'Kembali ke Aset';

            procurementGroup.classList.add('d-none');
        }


        /* =====================================================
           WARNING STATUS
        ===================================================== */

        function warning(item) {

            if (item.expiryDate < today) {
                return '<span class="badge bg-danger">Telah luput</span>';
            }

            const days = Math.ceil(
                (new Date(item.expiryDate) - new Date(today)) / 86400000
            );

            if (days <= 30) {
                return `
                    <span class="badge bg-warning text-dark">
                        Luput ${days} hari lagi
                    </span>
                `;
            }

            if (
                Number(item.quantity) <=
                Number(item.minimumStock)
            ) {
                return `
                    <span class="badge bg-warning text-dark">
                        Stok rendah
                    </span>
                `;
            }

            return '<span class="badge bg-success">Baik</span>';
        }


        /* =====================================================
           RENDER INVENTORY
        ===================================================== */

        function render() {

            inventoryBody.innerHTML = records.length
                ? records
                    .slice()
                    .sort(
                        (a, b) =>
                            String(a.expiryDate)
                                .localeCompare(String(b.expiryDate))
                    )
                    .map(item => `
                        <tr>

                            <td>
                                <strong>${esc(item.name)}</strong>

                                <div class="small text-muted">
                                    ${esc(item.strength)} ·
                                    ${esc(item.form)}
                                </div>
                            </td>

                            <td>
                                ${esc(item.batchNumber)}
                            </td>

                            <td>
                                ${esc(item.expiryDate)}
                            </td>

                            <td>
                                <strong>
                                    ${esc(item.quantity)}
                                </strong>

                                ${esc(item.unit)}

                                <div class="small text-muted">
                                    Minimum:
                                    ${esc(item.minimumStock)}
                                </div>
                            </td>

                            <td>
                                ${warning(item)}
                            </td>

                            <td class="text-end">

                                <button
                                    class="btn btn-sm btn-outline-primary"
                                    onclick="editRecord('${esc(item.id)}')">

                                    <i class="bi bi-pencil-square me-1"></i>
                                    Kemas Kini

                                </button>

                            </td>

                        </tr>
                    `)
                    .join('')

                : `
                    <tr>
                        <td
                            colspan="6"
                            class="text-center text-muted py-4">

                            Belum ada stok ubat untuk misi ini.

                        </td>
                    </tr>
                `;


            /* STOCK MOVEMENTS */

            const movements = records
                .flatMap(item =>
                    (item.stockMovements || []).map(m => ({
                        ...m,
                        name: item.name,
                        batch: item.batchNumber
                    }))
                )
                .sort(
                    (a, b) =>
                        String(b.date)
                            .localeCompare(String(a.date))
                );


            movementBody.innerHTML = movements.length
                ? movements.map(m => `
                    <tr>

                        <td>
                            ${esc(
                                new Date(m.date)
                                    .toLocaleString('ms-MY')
                            )}
                        </td>

                        <td>
                            ${esc(m.name)} /
                            ${esc(m.batch)}
                        </td>

                        <td>
                            <span
                                class="badge ${
                                    m.type === 'IN'
                                        ? 'bg-success'
                                        : 'bg-danger'
                                }">

                                ${
                                    m.type === 'IN'
                                        ? 'Masuk'
                                        : 'Keluar'
                                }

                            </span>
                        </td>

                        <td>${esc(m.quantity)}</td>

                        <td>${esc(m.balanceAfter)}</td>

                        <td>${esc(m.note || '-')}</td>

                    </tr>
                `).join('')

                : `
                    <tr>
                        <td
                            colspan="6"
                            class="text-center text-muted py-3">

                            Belum ada pergerakan stok.

                        </td>
                    </tr>
                `;


            /* CRITICAL STOCK */

            const critical = records.filter(
                item =>
                    item.expiryDate < today ||
                    Number(item.quantity) <=
                    Number(item.minimumStock)
            );

            alerts.innerHTML = critical.length
                ? `
                    <div class="alert alert-warning">

                        <strong>
                            ${critical.length}
                            batch memerlukan perhatian.
                        </strong>

                        Semak stok rendah atau tarikh luput
                        sebelum pendispensan.

                    </div>
                `
                : '';
        }


        /* =====================================================
           LOAD INVENTORY
        ===================================================== */

        async function load() {

            const response =
                await fetch(`${API}/api/medicine-inventory`);

            const json =
                await response.json();

            if (!response.ok || !json.success) {
                throw new Error(
                    json.message ||
                    'Inventori gagal dimuatkan.'
                );
            }

            const all = json.data || [];

            centralRecords =
                all.filter(item => !item.missionId);

            records =
                all.filter(
                    item =>
                        String(item.missionId || '') ===
                        String(missionId)
                );


            sourceMedicineId.innerHTML =
                '<option value="">-- Pilih stok --</option>' +

                centralRecords
                    .filter(item => Number(item.quantity) > 0)
                    .sort(
                        (a, b) =>
                            String(a.expiryDate)
                                .localeCompare(String(b.expiryDate))
                    )
                    .map(item => `
                        <option value="${esc(item.id)}">

                            ${esc(item.name)}
                            ${esc(item.strength)}
                            · ${esc(item.batchNumber)}
                            · Baki ${esc(item.quantity)}
                            ${esc(item.unit)}

                        </option>
                    `)
                    .join('');


            render();
        }


        /* =====================================================
           EDIT RECORD
        ===================================================== */

        window.editRecord = id => {

            const item =
                records.find(
                    x => String(x.id) === String(id)
                );

            if (!item) return;

            editingRecord = item;

            recordId.value = item.id;


            [
                'name',
                'strength',
                'form',
                'unit',
                'batchNumber',
                'expiryDate',
                'quantity',
                'minimumStock',
                'supplier'
            ].forEach(key => {

                document.getElementById(key).value =
                    item[key] ?? '';
            });


            procurementGroup.classList.add('d-none');
            sourceGroup.classList.add('d-none');


            [
                'name',
                'strength',
                'form',
                'unit',
                'batchNumber',
                'expiryDate',
                'minimumStock',
                'supplier'
            ].forEach(key => {

                const element =
                    document.getElementById(key);

                element.readOnly = false;
                element.classList.remove('bg-light');
            });


            cancelEdit.classList.remove('d-none');

            scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        };


        /* =====================================================
           CANCEL EDIT
        ===================================================== */

        cancelEdit.onclick = () => {

            inventoryForm.reset();

            editingRecord = null;

            recordId.value = '';

            minimumStock.value = 10;

            cancelEdit.classList.add('d-none');

            procurementGroup.classList.toggle(
                'd-none',
                !missionId
            );

            procurementCategory.onchange();
        };


        /* =====================================================
           PROCUREMENT CATEGORY
        ===================================================== */

        procurementCategory.onchange = () => {

            const fromMyemt =
                missionId &&
                procurementCategory.value ===
                'Stok Ubat MyEMT';


            sourceGroup.classList.toggle(
                'd-none',
                !fromMyemt
            );

            sourceMedicineId.required =
                fromMyemt;


            [
                'name',
                'strength',
                'form',
                'unit',
                'batchNumber',
                'expiryDate',
                'minimumStock',
                'supplier'
            ].forEach(key => {

                const element =
                    document.getElementById(key);

                element.readOnly = !!fromMyemt;

                element.classList.toggle(
                    'bg-light',
                    !!fromMyemt
                );
            });


            if (!fromMyemt) {

                sourceMedicineId.value = '';

                sourceInfo.textContent = '';

                quantity.removeAttribute('max');
            }
        };


        /* =====================================================
           SOURCE MEDICINE
        ===================================================== */

        sourceMedicineId.onchange = () => {

            const item =
                centralRecords.find(
                    value =>
                        String(value.id) ===
                        sourceMedicineId.value
                );

            if (!item) return;


            [
                'name',
                'strength',
                'form',
                'unit',
                'batchNumber',
                'expiryDate',
                'minimumStock',
                'supplier'
            ].forEach(key => {

                document.getElementById(key).value =
                    item[key] ?? '';
            });


            quantity.min = 1;

            quantity.max = item.quantity;

            quantity.value = 1;


            sourceInfo.textContent =
                `Baki tersedia: ${item.quantity} ${item.unit}. ` +
                `Maklumat batch disalin; masukkan kuantiti untuk misi.`;
        };


        /* =====================================================
           SUBMIT INVENTORY
        ===================================================== */

        inventoryForm.onsubmit = async event => {

            event.preventDefault();

            const submitButton =
                inventoryForm.querySelector(
                    'button[type="submit"], button:not([type])'
                );

            submitButton.disabled = true;


            try {

                const value = id =>
                    document.getElementById(id).value;


                const id =
                    value('recordId');


                const selectedProcurement =
                    editingRecord?.procurementCategory ||
                    (
                        missionId
                            ? value('procurementCategory')
                            : 'Stok MyEMT'
                    );


                const payload = {

                    missionId,

                    name:
                        value('name').trim(),

                    strength:
                        value('strength').trim(),

                    form:
                        value('form').trim(),

                    unit:
                        value('unit').trim(),

                    batchNumber:
                        value('batchNumber').trim(),

                    expiryDate:
                        value('expiryDate'),

                    quantity:
                        Number(value('quantity')),

                    minimumStock:
                        Number(value('minimumStock')),

                    supplier:
                        value('supplier').trim(),

                    procurementCategory:
                        selectedProcurement,

                    sourceMedicineId:
                        !id &&
                        missionId &&
                        selectedProcurement === 'Stok Ubat MyEMT'
                            ? value('sourceMedicineId')
                            : ''
                };


                const query =
                    id
                        ? (
                            missionId
                                ? `?missionId=${encodeURIComponent(missionId)}`
                                : ''
                        )
                        : '';


                const response =
                    await fetch(
                        `${API}/api/medicine-inventory${
                            id
                                ? `/${encodeURIComponent(id)}${query}`
                                : ''
                        }`,
                        {
                            method: id ? 'PATCH' : 'POST',

                            headers: {
                                'Content-Type': 'application/json'
                            },

                            body: JSON.stringify(payload)
                        }
                    );


                const text =
                    await response.text();


                let json = {};


                try {

                    json =
                        text
                            ? JSON.parse(text)
                            : {};

                } catch (_) {

                    json = {
                        message: text
                    };
                }


                if (!response.ok || !json.success) {

                    const missingRoute =
                        response.status === 404 &&
                        /route tidak dijumpai/i.test(
                            json.message || ''
                        );


                    throw new Error(
                        missingRoute

                            ? 'Route Inventori Ubat belum tersedia pada API production. Deploy semula stack Lambda/SAM yang terkini.'

                            : json.message ||
                              `Stok gagal disimpan (HTTP ${response.status}).`
                    );
                }


                alert(json.message);

                cancelEdit.click();

                await load();


            } catch (error) {

                alert(
                    error.message ||
                    'Stok gagal disimpan. Sila semak sambungan API.'
                );

            } finally {

                submitButton.disabled = false;
            }
        };


        /* =====================================================
           INITIAL LOAD
        ===================================================== */

        procurementCategory.onchange();

        load().catch(
            error => alert(error.message)
        );

    </script>

</body>
</html>
