<!-- =====================================================
     ILI DASHBOARD CONTENT
===================================================== -->


<div id="iliDashboard">


<!-- ================= HEADER ================= -->

<div class="mb-4">

    <small class="text-muted">
        Paparan trend kes Influenza-Like Illness (ILI)
        berdasarkan laporan hospital dan klinik.
    </small>

</div>






<!-- ================= FILTER + TREND ================= -->


<div class="row g-3 mb-4">



<!-- ================= FILTER ================= -->


<div class="col-md-4">


<div class="card shadow-sm h-100">


<div class="card-body">


<h6 class="fw-bold mb-3">

<i class="bi bi-funnel me-1"></i>
Filter

</h6>





<label class="form-label">
Cari Hospital / Klinik
</label>


<select
id="iliDashboardHospitalFilter"
class="form-select mb-3">


<option value="">
Semua Hospital
</option>


<option>
Hospital Kuala Lumpur, Pathology
</option>

<option>
Hospital Melaka, Pathology
</option>

<option>
Hospital Pulau Pinang, Pathology
</option>

<option>
Hospital Queen Elizabeth, Pathology
</option>

<option>
Hospital Raja Permaisuri Bainun (Ipoh), Pathology
</option>

<option>
Hospital Sultanah Aminah (Johor Bahru), Pathology
</option>

<option>
Hospital Sultanah Bahiyah (Alor Setar), Pathology
</option>

<option>
Hospital Tuanku Jaafar (Seremban), Pathology
</option>

<option>
Hospital Umum Sarawak, Pathology
</option>


</select>







<label class="form-label">

Tarikh

</label>


<input
type="date"
id="iliDashboardDateFilter"
class="form-control mb-3">






<button
class="btn btn-secondary w-100"
onclick="resetILIDashboardFilter()">


<i class="bi bi-arrow-clockwise me-1"></i>

Reset


</button>



</div>


</div>


</div>








<!-- ================= TREND CHART ================= -->


<div class="col-md-8">


<div class="card shadow-sm h-100">


<div class="card-body">


<h6 class="fw-bold mb-3">


<i class="bi bi-graph-up me-1"></i>

Trend Terkini Kes ILI


</h6>





<div style="height:300px;">


<canvas id="iliTrendChart"></canvas>


</div>



</div>


</div>


</div>




</div>









<!-- ================= REPORT BY HOSPITAL ================= -->


<div class="row g-3 mb-4">


<div class="col-12">


<div class="card shadow-sm">



<div class="card-header bg-white fw-bold">


<i class="bi bi-bar-chart me-2"></i>

Laporan ILI Mengikut Hospital


</div>





<div class="card-body">


<div style="height:350px;">


<canvas id="iliHospitalChart"></canvas>


</div>


</div>



</div>


</div>


</div>









<!-- ================= SUMMARY ================= -->

<div class="row g-3 mb-4">


<!-- JUMLAH KES -->

<div class="col-md-4">

<div class="card shadow-sm border-0 h-100">


<div class="card-body d-flex align-items-center">


<div class="rounded-circle bg-primary bg-opacity-10 p-3 me-3">

<i class="bi bi-clipboard-data text-primary fs-3"></i>

</div>


<div>

<h6 class="text-muted mb-1">
Jumlah Kes Dipaparkan
</h6>


<h2 class="fw-bold mb-0"
id="iliDashboardTotalCases">

0

</h2>


</div>


</div>


</div>

</div>








<!-- HOSPITAL -->

<div class="col-md-4">

<div class="card shadow-sm border-0 h-100">


<div class="card-body d-flex align-items-center">


<div class="rounded-circle bg-success bg-opacity-10 p-3 me-3">

<i class="bi bi-hospital text-success fs-3"></i>

</div>


<div>

<h6 class="text-muted mb-1">
Hospital Terlibat
</h6>


<h2 class="fw-bold mb-0"
id="iliDashboardTotalHospital">

0

</h2>


</div>


</div>


</div>

</div>







<!-- PURATA -->

<div class="col-md-4">

<div class="card shadow-sm border-0 h-100">


<div class="card-body d-flex align-items-center">


<div class="rounded-circle bg-warning bg-opacity-10 p-3 me-3">

<i class="bi bi-graph-up text-warning fs-3"></i>

</div>


<div>

<h6 class="text-muted mb-1">
Purata Kes
</h6>


<h2 class="fw-bold mb-0"
id="iliDashboardAverage">

0

</h2>


</div>


</div>


</div>

</div>



</div>
