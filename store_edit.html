<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Kemaskini Lokasi Penyimpanan</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

    <!-- PAGE HEADER -->
    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
        <h4 class="mb-0">Kemaskini Lokasi Penyimpanan</h4>
        <small class="text-muted">
            Kemaskini maklumat lokasi penyimpanan untuk aset EMT seperti warehouse, hospital, atau stor lapangan.
        </small>
        </div>

        <a href="store_all.html" class="btn btn-primary">
        <i class="bi bi-arrow-left me-1"></i> Kembali
        </a>

    </div>

    <!-- FORM CARD -->
    <div class="card shadow-sm">

        <div class="card-header bg-white">
        <strong>Maklumat Lokasi Penyimpanan</strong>
        </div>

        <div class="card-body">

        <form id="storeForm">

        <div class="row g-3">

            <!-- NAMA LOKASI -->
            <div class="col-md-6">
            <label class="form-label">Nama Lokasi</label>
            <input type="text" id="name" name="name" class="form-control" required
                    placeholder="Contoh: Warehouse EMT Sabah / Hospital Kuala Lumpur">
            </div>

            <!-- KOD LOKASI -->
            <div class="col-md-3">
            <label class="form-label">Kod Lokasi</label>
            <input type="text" id="code" name="code" class="form-control" required>
            </div>

            <!-- NEGERI -->
            <div class="col-md-3">
            <label class="form-label">Negeri</label>
            <select id="state" name="state" class="form-select" required>

                <option>Johor</option>
                <option>Kedah</option>
                <option>Kelantan</option>
                <option>Melaka</option>
                <option>Negeri Sembilan</option>
                <option>Pahang</option>
                <option>Perak</option>
                <option>Perlis</option>
                <option>Pulau Pinang</option>

                <option>Sabah</option>

                <option>Sarawak</option>
                <option>Selangor</option>
                <option>Terengganu</option>
                <option>WP Kuala Lumpur</option>
                <option>WP Putrajaya</option>

            </select>
            </div>

            <!-- JENIS LOKASI -->
            <div class="col-md-4">
            <label class="form-label">Jenis Lokasi</label>
            <select id="type" name="type" class="form-select" required>

                <option>Warehouse Utama</option>
                <option>Stor Hospital</option>

                <option>Stor Lapangan (Field Base)</option>

                <option>Unit Logistik</option>
                <option>Lain-lain</option>

            </select>
            </div>

            <!-- KAPASITI -->
            <div class="col-md-4">
            <label class="form-label">Kapasiti Penyimpanan</label>
            <input type="number" id="capacity" name="capacity" min="0" step="1" class="form-control" required
                    placeholder="Contoh: 100 (unit aset)">
            </div>

            <!-- STATUS -->
            <div class="col-md-4">
            <label class="form-label">Status Lokasi</label>
            <select id="status" name="status" class="form-select" required>

                <option selected>Aktif</option>
                <option>Tidak Aktif</option>
                <option>Dalam Penyelenggaraan</option>

            </select>
            </div>

            <!-- ALAMAT -->
            <div class="col-12">
            <label class="form-label">Alamat Lengkap</label>
            <textarea id="address" name="address" class="form-control" rows="3" required data-location-picker data-latitude-field="latitude" data-longitude-field="longitude"></textarea>
            <input type="hidden" id="latitude" name="latitude"><input type="hidden" id="longitude" name="longitude">
            </div>

            <!-- CATATAN -->
            <div class="col-12">
            <label class="form-label">Catatan</label>
            <textarea id="notes" name="notes" class="form-control" rows="2"></textarea>
            </div>

        </div>

        <!-- BUTTON -->
        <div class="d-flex justify-content-end mt-4">

            <button type="submit" class="btn btn-primary px-4 rounded-pill shadow-sm">
            <i class="bi bi-check-circle me-1"></i>
            Kemaskini Lokasi
            </button>

        </div>

        </form>

        </div>

    </div>

    </main>




    
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="assets/js/myemt-location.js"></script>
<script>
function fillByLabel(labelText, value) {
  if (value === undefined || value === null) return;
  for (const lbl of document.querySelectorAll('.form-label')) {
    if (lbl.textContent.trim() === labelText) {
      const parent = lbl.closest('[class*="col-"], .mb-3');
      const input = parent?.querySelector('input, select, textarea');
      if (input) { input.value = String(value); return; }
    }
  }
}
function getByLabel(labelText) {
  for (const lbl of document.querySelectorAll('.form-label')) {
    if (lbl.textContent.trim() === labelText) {
      const parent = lbl.closest('[class*="col-"], .mb-3');
      const input = parent?.querySelector('input:not([readonly]), select, textarea');
      return input ? input.value : null;
    }
  }
  return null;
}

const id = new URLSearchParams(location.search).get('id');
if (id) {
  fetch(`${API}/api/stores/${encodeURIComponent(id)}`)
    .then(r => r.json())
    .then(({ data: s }) => {
      if (!s) return;
      fillByLabel('Nama Lokasi', s.name);
      fillByLabel('Kod Lokasi', s.code || s.id);
      fillByLabel('Negeri', s.state);
      fillByLabel('Jenis Lokasi', s.type);
      fillByLabel('Kapasiti Penyimpanan', s.capacity);
      fillByLabel('Status Lokasi', s.status);
      fillByLabel('Alamat Lengkap', s.address);
      fillByLabel('Catatan', s.notes);
      document.getElementById('latitude').value=s.latitude??'';
      document.getElementById('longitude').value=s.longitude??'';
      window.MyEMTLocation?.refresh(document.getElementById('address'));
    })
    .catch(() => {});

  const form = document.querySelector('form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if(document.getElementById('latitude').value===''||document.getElementById('longitude').value===''){alert('Sila pilih titik lokasi stor pada peta.');document.getElementById('address').focus();return;}
      const payload = {
        name:     getByLabel('Nama Lokasi'),
        code:     getByLabel('Kod Lokasi'),
        state:    getByLabel('Negeri'),
        type:     getByLabel('Jenis Lokasi'),
        capacity: Number(getByLabel('Kapasiti Penyimpanan')),
        status:   getByLabel('Status Lokasi'),
        address:  getByLabel('Alamat Lengkap'),
        notes:    getByLabel('Catatan'),
        latitude: Number(document.getElementById('latitude').value),
        longitude: Number(document.getElementById('longitude').value),
      };
      try {
        const res = await fetch(`${API}/api/stores/${encodeURIComponent(id)}`, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
        });
        const json = await res.json();
        if (json.success) { alert('Lokasi berjaya dikemaskini!'); history.back(); }
        else alert('Ralat: ' + (json.message || 'Kemaskini gagal.'));
      } catch { alert('Ralat rangkaian.'); }
    });
  }
}
</script>
</body>
</html>
