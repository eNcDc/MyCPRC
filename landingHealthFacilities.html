<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MyReHF Reporting</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">

  <!-- Main CSS -->
  <link href="assets/css/main.css" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- LEFT PANEL -->
    <!-- LEFT PANEL -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder">
      <!-- Sidebar will be loaded here -->
    </aside>

    <!-- MAIN CONTENT -->
    <main class="col-md-9 col-lg-10 px-4 py-4">

      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0">Malaysia Resilient Healthcare Facilities (MyReHF)</h4>
      </div>

        <!-- TAB BAR -->
      <ul class="nav nav-tabs mb-4" id="myrehfTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="myrehf-dashboard-tab"
            data-bs-toggle="tab"
            data-bs-target="#myrehf-dashboard-pane"
            type="button"
            role="tab">
            <i class="bi bi-speedometer2 me-1"></i> Dashboard
          </button>
        </li>

        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="myrehf-reports-tab"
            data-bs-toggle="tab"
            data-bs-target="#myrehf-reports-pane"
            type="button"
            role="tab">
            <i class="bi bi-file-earmark-text me-1"></i> MyReHF Reports
          </button>
        </li>
      </ul>

      <!-- TAB CONTENT -->
      <div class="tab-content" id="myrehfTabsContent">

        <!-- DASHBOARD TAB -->
        <div class="tab-pane fade show active" id="myrehf-dashboard-pane" role="tabpanel">
          <div id="myrehf-dashboard-content">
            <!-- myrehf_dashboard.html will load here -->
          </div>
        </div>

        <!-- REPORTS TAB -->
        <div class="tab-pane fade" id="myrehf-reports-pane" role="tabpanel">

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="mb-0">Dashboard MyReHF</h4>

            <a href="myrehf_form.html" class="btn btn-primary">
              <i class="bi bi-plus-circle me-1"></i> Isi Borang Baharu
            </a>
          </div>

          <!-- SUMMARY CARDS -->
          <div class="row g-3 mb-4">
            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Jumlah Laporan</h6>
                  <h3 class="mb-0">12</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Draft</h6>
                  <h3 class="mb-0">3</h3>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="card shadow-sm">
                <div class="card-body">
                  <h6 class="text-muted">Submitted</h6>
                  <h3 class="mb-0">9</h3>
                </div>
              </div>
            </div>
          </div>

          <!-- RECENT REPORTS -->
          <div class="card shadow-sm">
            <div class="card-header bg-white">
              <strong>Laporan Terkini</strong>
            </div>

            <div class="table-responsive">
              <table class="table table-striped mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Tarikh</th>
                    <th>Fasiliti</th>
                    <th>Status</th>
                    <th class="text-end">Tindakan</th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>12/01/2026</td>
                    <td>Hospital Putrajaya</td>
                    <td><span class="badge bg-success">Submitted</span></td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-primary">View</button>
                    </td>
                  </tr>

                  <tr>
                    <td>10/01/2026</td>
                    <td>Hospital Cyberjaya</td>
                    <td><span class="badge bg-warning text-dark">Draft</span></td>
                    <td class="text-end">
                      <button class="btn btn-sm btn-outline-secondary">Edit</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>

      </div>

    </main>

  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Layout -->
<script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => document.getElementById("header").innerHTML = data);

  fetch("sidebar.html")
    .then(res => res.text())
    .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);

  fetch("footer.html")
    .then(res => res.text())
    .then(data => document.getElementById("footer").innerHTML = data);
</script>

<!-- Dashboard Libraries -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="assets/js/myrehf_dashboard.js"></script>

<!-- Load myrehf Dashboard -->
<script>
  fetch("myrehf_dashboard.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("myrehf-dashboard-content").innerHTML = data;

      if (typeof initmyrehfDashboard === "function") {
        initmyrehfDashboard();
      }
    })
    .catch(err => console.error("Failed to load myrehf dashboard:", err));
</script>

<script src="assets/js/wizard-form.js"></script>

</body>
</html>
