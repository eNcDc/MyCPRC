<script>

    /* =====================================================
       SHOW / HIDE FORM
    ====================================================== */

    function showForm(formType) {

        const dekonContainer =
            document.getElementById("dekonFormContainer");

        const risikoContainer =
            document.getElementById("risikoFormContainer");

        const btnDekon =
            document.getElementById("btnDekon");

        const btnRisiko =
            document.getElementById("btnRisiko");


        if (formType === "dekon") {

            // Show Dekon
            dekonContainer.style.display = "block";

            // Hide Risiko
            risikoContainer.style.display = "none";

            // Button active
            btnDekon.classList.remove("btn-outline-primary");
            btnDekon.classList.add("btn-primary");

            btnRisiko.classList.remove("btn-primary");
            btnRisiko.classList.add("btn-outline-primary");

        }


        else if (formType === "risiko") {

            // Hide Dekon
            dekonContainer.style.display = "none";

            // Show Risiko
            risikoContainer.style.display = "block";

            // Button active
            btnRisiko.classList.remove("btn-outline-primary");
            btnRisiko.classList.add("btn-primary");

            btnDekon.classList.remove("btn-primary");
            btnDekon.classList.add("btn-outline-primary");

        }

    }

       DEFAULT FORM

        "Labuan": [
            "Labuan"
        ]

    };


    /* =====================================================
       FUNCTION UNTUK SET DAERAH
    ====================================================== */

    function setupDaerah(negeriId, daerahId) {

        const negeri =
            document.getElementById(negeriId);

        const daerah =
            document.getElementById(daerahId);


        negeri.addEventListener("change", function () {

            const selectedNegeri = this.value;

            daerah.innerHTML = "";

            if (!selectedNegeri) {

                daerah.disabled = true;

                daerah.innerHTML = `
                    <option value="">
                        -- Pilih Negeri Terlebih Dahulu --
                    </option>
                `;

                return;
            }


            daerah.disabled = false;

            daerah.innerHTML = `
                <option value="">
                    -- Pilih Daerah --
                </option>
            `;


            if (daerahData[selectedNegeri]) {

                daerahData[selectedNegeri].forEach(
                    function (namaDaerah) {

                        const option =
                            document.createElement("option");

                        option.value = namaDaerah;

                        option.textContent = namaDaerah;

                        daerah.appendChild(option);

                    }
                );

            }

        });

    }


    /* =====================================================
       SETUP DAERAH UNTUK KEDUA-DUA FORM
    ====================================================== */

    setupDaerah(
        "dekon_negeri",
        "dekon_daerah"
    );

    setupDaerah(
        "risiko_negeri",
        "risiko_daerah"
    );


    /* =====================================================
       JENIS FASILITI → LAIN-LAIN
    ====================================================== */

    document
        .getElementById("dekon_jenisFasiliti")
        .addEventListener("change", function () {

            const container =
                document.getElementById(
                    "dekon_lainLainContainer"
                );

            const input =
                document.getElementById(
                    "dekon_jenisFasilitiLain"
                );


            if (this.value === "Lain-lain") {

                container.style.display = "block";

                input.required = true;

            }

            else {

                container.style.display = "none";

                input.required = false;

                input.value = "";

            }

        });

</script>


</body>
</html>
