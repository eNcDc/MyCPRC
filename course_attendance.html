<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Daftar Kehadiran Latihan MyEMT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="assets/css/main.css" rel="stylesheet">
</head>
<body>
<div id="header"></div>
<div class="container-fluid"><div class="row">
  <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>
  <main class="col-md-9 col-lg-10 px-4 py-4">
    <div class="d-flex justify-content-between align-items-start mb-4">
      <div><h4 class="mb-1">Daftar Kehadiran Latihan</h4><p class="text-muted mb-0">Lokasi semasa digunakan sekali sahaja untuk mengesahkan kehadiran di lokasi latihan.</p></div>
      <a class="btn btn-outline-primary" href="course_apply.html"><i class="bi bi-arrow-left me-1"></i>Kembali</a>
    </div>
    <div class="card"><div class="card-body p-4">
      <div id="attendanceInfo" class="mb-4">Memuatkan maklumat sesi...</div>
      <div class="alert alert-info"><i class="bi bi-geo-alt-fill me-1"></i>Benarkan capaian lokasi apabila diminta. Sistem akan menyemak jarak daripada lokasi latihan yang ditetapkan oleh pentadbir.</div>
      <button id="checkInButton" class="btn btn-primary" disabled><i class="bi bi-geo-alt me-1"></i>Sahkan Lokasi dan Daftar Hadir</button>
      <div id="attendanceMessage" class="mt-3" aria-live="polite"></div>
    </div></div>
  </main>
</div></div>
<div id="footer"></div>
<script>fetch('header.html').then(r=>r.text()).then(x=>header.innerHTML=x);fetch('sidebar.html').then(r=>r.text()).then(x=>document.getElementById('sidebar-placeholder').innerHTML=x);fetch('footer.html').then(r=>r.text()).then(x=>footer.innerHTML=x);</script>
<script src="assets/js/config.js"></script>
<script>
const applicationId=new URLSearchParams(location.search).get('id');
const button=document.getElementById('checkInButton'),message=document.getElementById('attendanceMessage');
async function load(){
  if(!applicationId){message.innerHTML='<div class="alert alert-danger">ID pendaftaran tidak dijumpai.</div>';return;}
  try{
    const response=await fetch(`${API}/api/course-applications/${encodeURIComponent(applicationId)}`),json=await response.json();
    if(!response.ok||!json.success)throw new Error(json.message||'Pendaftaran tidak dijumpai.');
    const application=json.data,sessionResponse=await fetch(`${API}/api/sessions/${encodeURIComponent(application.sessionId)}`),sessionJson=await sessionResponse.json(),session=sessionJson.data||{};
    document.getElementById('attendanceInfo').innerHTML=`<h5>${MyEMT.escapeHTML(session.name||application.sessionName||'-')}</h5><div class="text-muted"><i class="bi bi-calendar me-1"></i>${MyEMT.escapeHTML(session.startDate||'-')} hingga ${MyEMT.escapeHTML(session.endDate||'-')}<br><i class="bi bi-geo-alt me-1"></i>${MyEMT.escapeHTML(session.location||'-')}</div>`;
    if(application.attendance?.status==='attended'){message.innerHTML='<div class="alert alert-success">Kehadiran anda telah direkodkan.</div>';return;}
    button.disabled=false;
  }catch(error){message.innerHTML=`<div class="alert alert-danger">${MyEMT.escapeHTML(error.message)}</div>`;}
}
button.addEventListener('click',()=>{
  if(!navigator.geolocation){message.innerHTML='<div class="alert alert-danger">Peranti ini tidak menyokong pengesanan lokasi.</div>';return;}
  button.disabled=true;message.innerHTML='<div class="alert alert-info">Mendapatkan lokasi semasa...</div>';
  navigator.geolocation.getCurrentPosition(async position=>{
    try{
      const response=await fetch(`${API}/api/course-applications/${encodeURIComponent(applicationId)}/check-in`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy})}),json=await response.json();
      if(!response.ok||!json.success)throw new Error(json.message||'Kehadiran gagal direkodkan.');
      message.innerHTML=`<div class="alert alert-success">${MyEMT.escapeHTML(json.message)}</div>`;
    }catch(error){button.disabled=false;message.innerHTML=`<div class="alert alert-danger">${MyEMT.escapeHTML(error.message)}</div>`;}
  },error=>{button.disabled=false;message.innerHTML=`<div class="alert alert-danger">Lokasi tidak dapat diperoleh: ${MyEMT.escapeHTML(error.message)}</div>`;},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
});
document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
