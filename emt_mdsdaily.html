<script>
let allMds = [];

function renderTable(list) {
  const tbody = document.getElementById('tbody-mds');
  tbody.innerHTML = list.length ? list.map(r => `
    <tr>
      <td>${r.date || '-'}</td>
      <td>${r.patientName || '-'}</td>
      <td>${r.age ? r.age + ' Tahun' : '-'}</td>
      <td>${r.gender || '-'}</td>
      <td>${r.clinicalClass || '-'}</td>
      <td>${r.outcome || '-'}</td>
      <td>${r.context || '-'}</td>
      <td class="text-end">
        <a href="emt_mdsview.html?id=${r.id}" class="btn btn-sm btn-outline-primary">Lihat</a>
      </td>
    </tr>`).join('')
  : '<tr><td colspan="10" class="text-center text-muted py-3">Tiada rekod ditemui.</td></tr>';
}

async function loadMds() {
  const res = await fetch(`${API}/api/mds`);
  allMds = (await res.json()).data || [];
  renderTable(allMds);
}

// Wire filter button
document.querySelector('button.btn-primary').addEventListener('click', () => {
  const date     = document.querySelector('input[type=date]').value;
  const selects  = document.querySelectorAll('select');
  const clinical = selects[0].value;
  const outcome  = selects[1].value;
  const gender   = selects[2].value;

  let filtered = allMds;
  if (date)                      filtered = filtered.filter(r => r.date          === date);
  if (clinical && clinical !== 'Semua') filtered = filtered.filter(r => r.clinicalClass === clinical);
  if (outcome  && outcome  !== 'Semua') filtered = filtered.filter(r => r.outcome       === outcome);
  if (gender   && gender   !== 'Semua') filtered = filtered.filter(r => r.gender        === gender);
  renderTable(filtered);
});

// Wire reset button
document.querySelector('button.btn-outline-secondary').addEventListener('click', () => {
  document.querySelector('input[type=date]').value = '';
  document.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  renderTable(allMds);
});

document.addEventListener('DOMContentLoaded', loadMds);
</script>
