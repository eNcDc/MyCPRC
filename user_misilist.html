<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Senarai Misi MyEMT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS -->
    <link href="assets/css/main.css" rel="stylesheet">

    <style>
    .mds-card{
        border:1px solid #dee2e6;
        border-radius:12px;
        overflow:hidden;
        margin-bottom:1rem;
        box-shadow:0 .125rem .25rem rgba(0,0,0,.075);
    }

    .mds-card .card-header{
        background:#0d6efd;
        color:#fff;
        font-weight:600;
        padding:.75rem 1rem;
    }

    .mds-card .card-body{
        background:#fff;
        padding:1rem;
    }

    .form-check{
        margin-bottom:.5rem;
    }

    .form-label{
        font-weight:600;
    }

    .badge-soft{
        background:#e9ecef;
        color:#495057;
        font-weight:500;
    }

    .section-title{
        font-size:1.1rem;
        font-weight:700;
        margin-bottom:1rem;
        padding-bottom:.5rem;
        border-bottom:2px solid #dee2e6;
    }

    textarea{
        resize:vertical;
    }
    </style>

</head>

<body>

<!-- HEADER -->
<div id="header"></div>

<div class="container-fluid">
  <div class="row">

    <!-- SIDEBAR -->
    <aside class="col-md-3 col-lg-2 sidebar p-0" id="sidebar-placeholder"></aside>

        <!-- MAIN CONTENT -->
        <main class="col-md-9 col-lg-10 px-4 py-4">

            <!-- PAGE HEADER -->
            <div class="d-flex justify-content-between align-items-start mb-4">

                <div>
                    <h4 class="mb-1">Senarai Misi EMT</h4>
                    <small class="text-muted">
                        Senarai Penyertaan Misi MyEMT
                        
                    </small>
                </div>

                
                <a href="landingMyemt_mission.html"
                class="btn btn-primary rounded-pill px-3 shadow-sm">
                    <i class="bi bi-arrow-left me-1"></i> Kembali
                </a>
                

            </div>

            <!-- SUMMARY MISI -->
            <div class="row g-3 mb-4">

            <!-- COMPLETED -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                <div class="card-body d-flex align-items-center">

                    <div class="me-3 text-success fs-3">
                    <i class="bi bi-check-circle-fill"></i>
                    </div>

                    <div>
                    <small class="text-muted">Selesai</small>
                    <h4 class="fw-bold mb-0" id="cnt-selesai">-</h4>
                    </div>

                </div>
                </div>
            </div>

            <!-- IN PROGRESS -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                <div class="card-body d-flex align-items-center">

                    <div class="me-3 text-warning fs-3">
                    <i class="bi bi-arrow-repeat"></i>
                    </div>

                    <div>
                    <small class="text-muted">Sedang Dijalankan</small>
                    <h4 class="fw-bold mb-0" id="cnt-aktif">-</h4>
                    </div>

                </div>
                </div>
            </div>

            <!-- RECEIVED (NOT STARTED) -->
            <div class="col-md-4">
                <div class="card shadow-sm border-0">
                <div class="card-body d-flex align-items-center">

                    <div class="me-3 text-primary fs-3">
                    <i class="bi bi-inbox-fill"></i>
                    </div>

                    <div>
                    <small class="text-muted">Perancangan</small>
                    <h4 class="fw-bold mb-0" id="cnt-perancangan">-</h4>
                    </div>

                </div>
                </div>
            </div>

            </div>

            <!-- ================= TABLE CARD ================= -->
            <div class="card shadow-sm">

                <div class="card-header bg-white d-flex justify-content-between align-items-center">
                    <strong>Senarai Misi EMT</strong>

                    <!-- optional filter -->
                    <select class="form-select form-select-sm w-auto">
                        <option>Semua Status</option>
                        <option>Sedang Dijalankan</option>
                        <option>Selesai</option>
                        <option>Perancangan</option>
                    </select>
                </div>



                <div class="card-body p-0">

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead class="table-light">
                                <tr>
                                    <th>Nama Misi</th>
                                    <th>Tarikh Mula</th>
                                    <th>Anggaran Tamat</th>
                                    <th>Tarikh Sebenar Tamat</th>
                                    <th>Status</th>
                                    <th class="text-center">Tindakan</th>
                                </tr>
                            </thead>

                            <tbody id="tbody-misi-list">
                                <tr><td colspan="6" class="text-center text-muted py-3">Memuatkan...</td></tr>
                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </main>


    
  </div>
</div>

<!-- FOOTER -->
<div id="footer"></div>

<!-- LOAD HEADER / FOOTER / SIDEBAR -->
<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => document.getElementById("header").innerHTML = data);

fetch("footer.html")
  .then(res => res.text())
  .then(data => document.getElementById("footer").innerHTML = data);

fetch("sidebar.html")
  .then(res => res.text())
  .then(data => document.getElementById("sidebar-placeholder").innerHTML = data);
</script>

<script src="assets/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
const STATUS_BADGE = {
  'Selesai':           'bg-success',
  'Sedang Dijalankan': 'bg-primary',
  'Perancangan':       'bg-warning text-dark'
};

async function loadMisiList() {
  try {
    const res = await fetch(`${API}/api/missions`);
    const missions = (await res.json()).data || [];

    document.getElementById('cnt-selesai').textContent    = missions.filter(m => m.status === 'Selesai').length;
    document.getElementById('cnt-aktif').textContent      = missions.filter(m => m.status === 'Sedang Dijalankan').length;
    document.getElementById('cnt-perancangan').textContent = missions.filter(m => m.status === 'Perancangan').length;

    const tbody = document.getElementById('tbody-misi-list');
    if (!missions.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Tiada misi berdaftar</td></tr>';
      return;
    }
    tbody.innerHTML = missions.map(m => `
      <tr>
        <td class="fw-semibold">${m.name || '-'}</td>
        <td>${m.startDate || '-'}</td>
        <td>${m.estimatedEnd || '-'}</td>
        <td>${m.actualEnd || '<span class="text-muted">-</span>'}</td>
        <td><span class="badge ${STATUS_BADGE[m.status] || 'bg-secondary'}">${m.status || '-'}</span></td>
        <td class="text-center">
          <a href="user_misidetail.html?id=${m.id}" class="btn btn-sm btn-outline-primary rounded-pill px-3">Papar Butiran</a>
        </td>
      </tr>`).join('');
  } catch (e) {
    document.getElementById('tbody-misi-list').innerHTML = '<tr><td colspan="6" class="text-center text-danger py-3">Gagal memuatkan data.</td></tr>';
  }
}

document.addEventListener('DOMContentLoaded', loadMisiList);
</script>
</body>
</html>
